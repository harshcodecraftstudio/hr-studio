<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR STUDIO - Official App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0b0e; color: #fff; overflow-x: hidden; }

    /* Opening Splash */
    #splash-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: #000; display: flex; justify-content: center; align-items: center;
      z-index: 9999; animation: fadeOut 0.8s ease 2.2s forwards;
    }
    .splash-logo {
      font-size: 64px; font-weight: 900; letter-spacing: 5px; text-align: center;
      background: linear-gradient(135deg, #ff0055 0%, #7a00ff 50%, #00e5ff 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      animation: zoomPulse 1.5s ease-in-out infinite alternate;
    }
    @keyframes zoomPulse { 0% { transform: scale(0.85); opacity: 0.6; } 100% { transform: scale(1.1); opacity: 1; } }
    @keyframes fadeOut { 100% { opacity: 0; visibility: hidden; } }

    /* Header */
    header {
      position: sticky; top: 0; background: rgba(11, 11, 14, 0.85);
      backdrop-filter: blur(16px); z-index: 100; border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .nav-top { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; padding: 12px 20px; }
    .brand-logo {
      font-size: 20px; font-weight: 900; letter-spacing: 1.5px; text-align: center;
      background: linear-gradient(135deg, #ff0055 0%, #9e00ff 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .search-btn-icon {
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff; width: 40px; height: 40px; border-radius: 50%; display: flex;
      justify-content: center; align-items: center; cursor: pointer; justify-self: end;
    }

    .search-container { display: none; opacity: 0; transition: all 0.3s ease; padding: 0 20px 14px 20px; }
    .search-container.active { display: block; opacity: 1; }
    .search-box-wrapper input {
      width: 100%; padding: 11px 16px 11px 42px; background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; color: #fff; outline: none;
    }

    /* Grid */
    .container { padding: 20px 16px; max-width: 800px; margin: 0 auto; }
    .grid-layout { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .show-card {
      background: #141419; border-radius: 14px; overflow: hidden;
      cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .show-card img { width: 100%; height: 220px; object-fit: cover; display: block; }
    .show-details { padding: 12px; }
    .show-title { font-size: 15px; font-weight: 700; color: #f0f0f5; }
    .show-episodes { font-size: 12px; color: #ff0055; margin-top: 4px; font-weight: 600; }

    /* Player Popup */
    .player-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: rgba(0, 0, 0, 0.95); z-index: 1000; overflow-y: auto; padding: 20px 16px;
    }
    .player-modal.active { display: block; }
    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 28px; color: #fff; cursor: pointer; }
    
    .video-container {
      width: 100%; max-width: 800px; margin: 40px auto 20px auto;
      aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; position: relative;
    }
    .video-container iframe { width: 100%; height: 100%; border: none; }

    /* 3-Sec Ad Overlay Screen */
    .ad-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #111; display: none; flex-direction: column;
      justify-content: center; align-items: center; z-index: 10; text-align: center;
    }
    .ad-overlay.active { display: flex; }
    .ad-timer-text { font-size: 18px; font-weight: bold; color: #ff0055; margin-bottom: 10px; }

    .episodes-section { max-width: 800px; margin: 0 auto; }
    .episodes-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; color: #ff0055; }
    .episodes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
    .ep-btn {
      background: #1f1f27; border: 1px solid rgba(255,255,255,0.1); color: #fff;
      padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px;
    }
    .ep-btn.active { background: #ff0055; border-color: #ff0055; }
  </style>
</head>
<body>

  <div id="splash-screen"><div class="splash-logo">HRS</div></div>

  <header>
    <div class="nav-top">
      <div></div>
      <div class="brand-logo">HR STUDIO</div>
      <button class="search-btn-icon" onclick="toggleSearch()">🔍</button>
    </div>
    <div class="search-container" id="search-bar">
      <div class="search-box-wrapper">
        <input type="text" id="search-input" onkeyup="searchShows()" placeholder="Search shows...">
      </div>
    </div>
  </header>

  <div class="container"><div class="grid-layout" id="shows-container"></div></div>

  <!-- Player Popup -->
  <div class="player-modal" id="playerModal">
    <span class="close-btn" onclick="closePlayer()">&times;</span>
    <div class="video-container">
      <div class="ad-overlay" id="adOverlay">
        <div class="ad-timer-text" id="adTimerText">Loading Ad... (3s)</div>
        <p style="font-size:12px; color:#888;">Video will start automatically after ad</p>
      </div>
      <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay"></iframe>
    </div>
    <div class="episodes-section">
      <div class="episodes-title" id="modalShowTitle">Episodes</div>
      <div class="episodes-grid" id="episodesList"></div>
    </div>
  </div>

  <script>
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTXtzbDoOjeXakc4hA_OS2wtQTSP3iS4TVfEDNsRM8lZUoVqnktOrjOxvjl02zSOba4R4Uehf9OaONb/pub?gid=0&single=true&output=csv";
    
    let allShowsData = [];

    function toggleSearch() {
      const searchBar = document.getElementById('search-bar');
      searchBar.classList.toggle('active');
    }

    function parseCSVLine(line) {
      let delimiter = line.includes('\t') ? '\t' : ',';
      let result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        let char = line[i];
        if (char === '"') inQuotes = !inQuotes;
        else if (char === delimiter && !inQuotes) {
          result.push(current.trim().replace(/^"|"$/g, ''));
          current = '';
        } else current += char;
      }
      result.push(current.trim().replace(/^"|"$/g, ''));
      return result;
    }

    async function fetchShowsFromSheet() {
      try {
        const response = await fetch(GOOGLE_SHEET_CSV_URL + '&t=' + new Date().getTime());
        const data = await response.text();
        const rows = data.split(/\r?\n/).map(r => r.trim()).filter(r => r.length > 0);
        
        allShowsData = rows.map(row => {
          const cols = parseCSVLine(row);
          
          let episodesList = [];
          // Col 0: No, Col 1: Show Name, Col 2: Thumbnail, Col 3: Ep1, Col 4: Ad1, Col 5: Ep2, Col 6: Ad2...
          for (let i = 3; i < cols.length; i += 2) {
            if (cols[i]) {
              episodesList.push({
                youtube_id: cols[i],
                ad: cols[i+1] || ""
              });
            }
          }

          return {
            show_name: cols[1] || "",
            thumbnail: cols[2] || "",
            episodes: episodesList
          };
        }).filter(s => s.show_name && s.show_name.toLowerCase() !== 'show name');

        renderShows(allShowsData);
      } catch (error) { console.log(error); }
    }

    function renderShows(shows) {
      const container = document.getElementById('shows-container');
      container.innerHTML = "";
      shows.forEach((show, index) => {
        const card = document.createElement('div');
        card.className = 'show-card';
        card.innerHTML = `
          <img src="${show.thumbnail}" alt="${show.show_name}">
          <div class="show-details">
            <div class="show-title">${show.show_name}</div>
            <div class="show-episodes">${show.episodes.length} Episodes</div>
          </div>
        `;
        card.onclick = () => openShowPlayer(index);
        container.appendChild(card);
      });
    }

    function openShowPlayer(showIndex) {
      const show = allShowsData[showIndex];
      if (!show || show.episodes.length === 0) return;

      document.getElementById('modalShowTitle').innerText = show.show_name + " - Episodes";
      const epListContainer = document.getElementById('episodesList');
      epListContainer.innerHTML = "";

      show.episodes.forEach((ep, i) => {
        const btn = document.createElement('button');
        btn.className = 'ep-btn' + (i === 0 ? ' active' : '');
        btn.innerText = `Episode ${i + 1}`;
        btn.onclick = () => startEpisodeWithAd(ep.youtube_id, ep.ad, btn);
        epListContainer.appendChild(btn);
      });

      startEpisodeWithAd(show.episodes[0].youtube_id, show.episodes[0].ad, epListContainer.children[0]);
      document.getElementById('playerModal').classList.add('active');
    }

    function startEpisodeWithAd(youtubeId, adUrl, btnElement) {
      document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
      if (btnElement) btnElement.classList.add('active');

      const iframe = document.getElementById('videoPlayer');
      iframe.src = ""; // Stop current video

      if (adUrl && adUrl.startsWith('http')) {
        // Open Ad Link
        window.open(adUrl, '_blank');

        // Show 3-Sec Timer Overlay
        const overlay = document.getElementById('adOverlay');
        const timerText = document.getElementById('adTimerText');
        overlay.classList.add('active');

        let count = 3;
        timerText.innerText = `Playing Ad... (${count}s)`;

        let interval = setInterval(() => {
          count--;
          if (count > 0) {
            timerText.innerText = `Playing Ad... (${count}s)`;
          } else {
            clearInterval(interval);
            overlay.classList.remove('active');
            iframe.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1`;
          }
        }, 1000);
      } else {
        // Play directly if no ad
        iframe.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1`;
      }
    }

    function closePlayer() {
      document.getElementById('playerModal').classList.remove('active');
      document.getElementById('videoPlayer').src = "";
    }

    function searchShows() {
      const query = document.getElementById('search-input').value.toLowerCase();
      renderShows(allShowsData.filter(s => s.show_name.toLowerCase().includes(query)));
    }

    window.onload = fetchShowsFromSheet;
  </script>
</body>
</html>
