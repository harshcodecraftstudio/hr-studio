<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR STUDIO - Official App</title>
  <meta name="description" content="HR STUDIO - Watch your favorite shows and episodes.">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ff0055">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HR STUDIO">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0b0e; color: #fff; overflow-x: hidden; padding-bottom: 70px; }

    /* Splash Screen */
    #splash-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: #000; display: flex; justify-content: center; align-items: center;
      z-index: 9999; animation: fadeOut 0.8s ease 2.2s forwards;
    }
    .splash-logo-box {
      width: 120px; height: 120px; border-radius: 24px; overflow: hidden;
      box-shadow: 0 10px 35px rgba(255, 0, 85, 0.5);
      animation: zoomPulse 1.5s ease-in-out infinite alternate;
    }
    .splash-logo-box img { width: 100%; height: 100%; object-fit: cover; }
    @keyframes zoomPulse { 0% { transform: scale(0.85); } 100% { transform: scale(1.05); } }
    @keyframes fadeOut { 100% { opacity: 0; visibility: hidden; } }

    /* Header */
    header {
      position: sticky; top: 0; background: rgba(11, 11, 14, 0.95);
      backdrop-filter: blur(16px); z-index: 100; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 16px;
    }
    .nav-top { display: flex; align-items: center; justify-content: space-between; max-width: 800px; margin: 0 auto; }
    .brand-left { display: flex; align-items: center; gap: 10px; }
    .brand-logo-img { width: 36px; height: 36px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,0,85,0.4); }
    .brand-logo-img img { width: 100%; height: 100%; object-fit: cover; }
    .brand-title { font-size: 18px; font-weight: 900; background: linear-gradient(135deg, #ff0055, #00e5ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .search-btn-icon {
      background: #141419; border: 1px solid rgba(255, 255, 255, 0.1);
      color: #aaa; width: 38px; height: 38px; border-radius: 50%; display: flex;
      justify-content: center; align-items: center; cursor: pointer; font-size: 15px;
      transition: all 0.2s ease;
    }
    .search-btn-icon:hover { border-color: #ff0055; color: #fff; }

    .search-container { display: none; padding: 12px 0 0 0; max-width: 800px; margin: 0 auto; }
    .search-container.active { display: block; }
    .search-box-wrapper input {
      width: 100%; padding: 12px 16px; background: #141419;
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; color: #fff; outline: none;
      font-size: 14px; transition: border-color 0.2s;
    }
    .search-box-wrapper input:focus { border-color: #ff0055; }

    /* Fullscreen Reels Modal */
    .shorts-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: #000; z-index: 1000;
    }
    .shorts-modal.active { display: block; }
    
    .shorts-container {
      height: 100vh; width: 100%; overflow-y: scroll;
      scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    .shorts-container.locked { overflow-y: hidden; }

    .short-item {
      height: 100vh; width: 100%; scroll-snap-align: start; scroll-snap-stop: always;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      position: relative; background: #000; padding: 0;
    }

    /* Video Player Area */
    .video-wrapper {
      position: relative; width: 100%; height: 75vh;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden; background: #000;
    }
    .video-wrapper iframe {
      width: 100%; height: 100%; border: none; object-fit: cover; pointer-events: none;
    }
    .swipe-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
    }

    /* Welcome Screen Placeholder for Blank Ad */
    .welcome-ad-banner {
      width: 100%; height: 100%; background: linear-gradient(135deg, #141419, #0b0b0e);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; padding: 20px; z-index: 5;
    }
    .welcome-logo-box {
      width: 75px; height: 75px; border-radius: 18px; overflow: hidden; margin-bottom: 16px;
      border: 2px solid #ff0055; box-shadow: 0 0 25px rgba(255,0,85,0.5);
    }
    .welcome-logo-box img { width: 100%; height: 100%; object-fit: cover; }
    .welcome-title { font-size: 21px; font-weight: 900; color: #fff; margin-bottom: 6px; letter-spacing: 0.5px; }
    .welcome-sub { font-size: 13px; color: #ff0055; font-weight: 600; }

    /* Floating Heart Animation on Double Tap */
    .floating-heart-anim {
      position: absolute; font-size: 60px; color: #ff0055; z-index: 40;
      animation: heartPop 0.8s ease-out forwards; pointer-events: none;
      text-shadow: 0 0 20px rgba(255,0,85,0.8);
    }
    @keyframes heartPop {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1) translateY(-60px); opacity: 0; }
    }

    /* Right Side Floating Actions */
    .floating-actions {
      position: absolute; right: 16px; bottom: 90px; z-index: 50;
      display: flex; flex-direction: column; gap: 16px; align-items: center;
    }
    .action-btn {
      background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.15);
      width: 45px; height: 45px; border-radius: 50%; display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: #fff; cursor: pointer;
      backdrop-filter: blur(4px); transition: transform 0.2s, background 0.2s;
    }
    .action-btn:active { transform: scale(0.9); }
    .action-btn span { font-size: 10px; margin-top: 2px; font-weight: 600; }
    .action-btn.active { color: #ff0055; border-color: #ff0055; background: rgba(255, 0, 85, 0.15); }

    /* Ad Overlay & Skip & Learn More */
    .ad-overlay-container {
      position: absolute; bottom: 25px; right: 15px; z-index: 50;
      display: flex; gap: 8px; align-items: center;
    }
    .ad-skip-box {
      background: rgba(0, 0, 0, 0.85); border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 700;
      color: #fff; backdrop-filter: blur(5px); cursor: pointer;
      display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .ad-skip-box.hidden { display: none !important; }
    .ad-skip-box.disabled { opacity: 0.8; cursor: not-allowed; border-color: rgba(255, 0, 85, 0.6); }
    .ad-badge-tag { background: #ff0055; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 800; }

    .ad-learn-more-btn {
      background: #00e5ff; color: #000; border: none; padding: 9px 14px;
      border-radius: 8px; font-size: 12px; font-weight: 800; cursor: pointer;
      text-decoration: none; box-shadow: 0 4px 15px rgba(0,229,255,0.4);
      display: none; align-items: center; gap: 4px;
    }
    .ad-learn-more-btn.active { display: flex; }

    /* Custom video progress */
    .custom-progress { width:100%; margin-top:9px; pointer-events:none; }
    .progress-times { display:flex; justify-content:space-between; align-items:center; font-size:11px; font-weight:700; color:#fff; text-shadow:0 1px 4px #000; margin-bottom:5px; }
    .progress-track { width:100%; height:3px; background:rgba(255,255,255,.28); border-radius:99px; overflow:hidden; }
    .progress-fill { width:0%; height:100%; background:#fff; border-radius:99px; transition:width .15s linear; }
    .ad-frame { width:100%; height:100%; border:0; background:#000; }
    .ad-fallback { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:#111; color:#fff; text-align:center; padding:20px; }
    .ad-open-btn { display:inline-block; padding:10px 16px; border-radius:8px; background:#00e5ff; color:#000; font-weight:800; text-decoration:none; }

    /* Direct / Smart Link Ad Card (e.g. CPM network links that refuse to iframe) */
    .direct-ad-card {
      width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:14px; background: linear-gradient(135deg, #141419, #0b0b0e); text-align:center; padding:24px;
    }
    .direct-ad-badge { background:#ff0055; color:#fff; font-size:11px; font-weight:800; padding:4px 10px; border-radius:20px; letter-spacing:0.5px; }
    .direct-ad-title { font-size:17px; font-weight:800; color:#fff; }
    .direct-ad-sub { font-size:12px; color:rgba(255,255,255,0.55); max-width:260px; }
    .direct-ad-tap-btn {
      margin-top:6px; display:inline-flex; align-items:center; gap:6px; padding:12px 22px; border-radius:30px;
      background:#00e5ff; color:#000; font-weight:800; font-size:14px; text-decoration:none;
      box-shadow:0 6px 20px rgba(0,229,255,0.35);
    }

    /* Banner Script Ad (e.g. atOptions / invoke.js style networks) */
    .banner-ad-wrapper {
      width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
      background:#0b0b0e; gap:12px;
    }
    .banner-ad-tag { font-size:11px; font-weight:800; color:rgba(255,255,255,0.4); letter-spacing:1px; text-transform:uppercase; }
    .banner-ad-frame { border:0; background:#000; max-width:94%; }

    /* Video Info Section */
    .video-info-box { 
      width: 100%; padding: 12px 20px 16px; background: #0b0b0e;
      display: flex; justify-content: space-between; align-items: center;
    }
    .info-left { display: flex; flex-direction: column; width: 100%; }
    .show-name-text { font-size: 16px; font-weight: 800; color: #fff; }
    .episode-name-text { font-size: 13px; color: #ff0055; font-weight: 700; margin-top: 2px; }

    /* Grid Layout */
    .container { padding: 20px 16px; max-width: 800px; margin: 0 auto; }
    .grid-layout { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .show-card { background: #141419; border-radius: 14px; overflow: hidden; cursor: pointer; border: 1px solid rgba(255,255,255,0.06); }
    .show-card img { width: 100%; height: 220px; object-fit: cover; display: block; }
    .show-details { padding: 12px; }
    .show-title { font-size: 15px; font-weight: 700; color: #fff; }
    .show-episodes { font-size: 12px; color: #ff0055; margin-top: 4px; font-weight: 600; }

    /* History Separate Window */
    .history-page-view {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: #0b0b0e; z-index: 1500; overflow-y: auto; padding: 20px 16px 80px 16px;
    }
    .history-page-view.active { display: block; }
    
    .history-header-bar {
      display: flex; align-items: center; justify-content: space-between; max-width: 800px; margin: 0 auto 20px auto;
      border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px; position: relative;
    }
    .history-back-btn { font-size: 20px; font-weight: 700; color: #ff0055; cursor: pointer; }
    .history-page-title { font-size: 18px; font-weight: 900; color: #fff; position: absolute; left: 50%; transform: translateX(-50%); }
    
    .history-content-container { max-width: 800px; margin: 0 auto; }

    /* History Tabs (replaces old top-to-bottom stacked sections) */
    .history-tabs-row {
      display: flex; gap: 8px; background: #141419; border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px; padding: 5px; margin-bottom: 18px;
    }
    .history-tab-btn {
      flex: 1; text-align: center; padding: 10px 8px; border-radius: 10px; cursor: pointer;
      font-size: 13px; font-weight: 800; color: rgba(255,255,255,0.55); transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .history-tab-btn.active { background: linear-gradient(135deg, #ff0055, #ff3377); color: #fff; box-shadow: 0 4px 14px rgba(255,0,85,0.35); }
    .history-tab-count { font-size: 10px; opacity: 0.8; }

    .history-tab-panel { display: none; }
    .history-tab-panel.active { display: block; }

    /* Grid of cards within a tab (was: horizontal-scroll-row) */
    .history-grid-row {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    }
    .h-card-item {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; overflow: hidden; cursor: pointer;
      transition: transform 0.2s, border-color 0.2s; position: relative;
    }
    .h-card-item:hover { border-color: #ff0055; transform: translateY(-2px); }
    .h-card-thumb-wrapper { position: relative; width: 100%; height: 130px; background: #000; }
    .history-empty-msg { grid-column: 1 / -1; font-size: 12px; color: rgba(255,255,255,0.4); padding: 30px 0; text-align: center; }
    .h-card-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
    .h-card-time-tag {
      position: absolute; bottom: 6px; left: 6px; background: rgba(0, 0, 0, 0.75);
      color: #00e5ff; font-size: 9px; font-weight: 700; padding: 2px 6px;
      border-radius: 4px; backdrop-filter: blur(2px); border: 1px solid rgba(0,229,255,0.3);
    }
    .h-card-info { padding: 8px; }
    .h-card-title { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .h-card-subtitle { font-size: 11px; color: #ff0055; font-weight: 600; margin-top: 2px; }

    /* Footer App Navigation */
    .app-footer {
      position: fixed; bottom: 0; left: 0; width: 100%; background: #111115;
      border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex;
      justify-content: space-around; align-items: center; padding: 12px 0; z-index: 90;
    }
    .footer-item {
      display: flex; flex-direction: column; align-items: center; color: rgba(255, 255, 255, 0.6);
      font-size: 12px; cursor: pointer; text-decoration: none; gap: 4px; font-weight: 600;
    }
    .footer-item.active { color: #ff0055; }
    .footer-item svg { width: 20px; height: 20px; fill: currentColor; }

    .state-message {
      grid-column: 1 / -1; text-align: center; color: rgba(255,255,255,0.6);
      font-size: 14px; padding: 40px 10px;
    }
    .state-message.error-message { color: #ff0055; }
    .retry-btn {
      margin-top: 12px; background: rgba(255,0,85,0.15); border: 1px solid rgba(255,0,85,0.5);
      color: #fff; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: 700; font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash-screen">
    <div class="splash-logo-box">
      <img src="icon.png" alt="HRS Logo">
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="nav-top">
      <div class="brand-left">
        <div class="brand-logo-img"><img src="icon.png" alt="HRS"></div>
        <div class="brand-title">HR STUDIO</div>
      </div>
      <button class="search-btn-icon" onclick="toggleSearch()">🔍</button>
    </div>
    <div class="search-container" id="search-bar">
      <div class="search-box-wrapper">
        <input type="text" id="search-input" onkeyup="searchShows()" placeholder="🔍 Search shows...">
      </div>
    </div>
  </header>

  <!-- Main Content Grid -->
  <div class="container">
    <div class="grid-layout" id="shows-container"></div>
  </div>

  <!-- Fullscreen Reels Modal -->
  <div class="shorts-modal" id="shortsModal">
    <div class="shorts-container" id="shortsContainer"></div>
  </div>

  <!-- History Separate Window -->
  <div class="history-page-view" id="historyPageView">
    <div class="history-header-bar">
      <div class="history-back-btn" onclick="closeHistoryWindow()">←</div>
      <div class="history-page-title">History</div>
      <div style="width: 20px;"></div>
    </div>
    <div class="history-content-container">
      <div class="history-tabs-row" id="historyTabsRow">
        <div class="history-tab-btn active" data-tab="watch" onclick="switchHistoryTab('watch')">&#128337; History</div>
        <div class="history-tab-btn" data-tab="saved" onclick="switchHistoryTab('saved')">&#128190; Saved</div>
        <div class="history-tab-btn" data-tab="liked" onclick="switchHistoryTab('liked')">&#10084;&#65039; Liked</div>
      </div>
      <div id="historyContentBody"></div>
    </div>
  </div>

  <!-- Footer Navigation -->
  <div class="app-footer">
    <div class="footer-item active" id="footerHome" onclick="handleFooterClick('home')">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Home
    </div>
    <div class="footer-item" id="footerShare" onclick="handleFooterClick('share')">
      <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
      Share
    </div>
    <div class="footer-item" id="footerHistory" onclick="handleFooterClick('history')">
      <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
      History
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTXtzbDoOjeXakc4hA_OS2wtQTSP3iS4TVfEDNsRM8lZUoVqnktOrjOxvjl02zSOba4R4Uehf9OaONb/pub?gid=0&single=true&output=csv";

    let allShowsData = [];
    let savedScrollPosition = 0;
    let activeAdCountdown = null;
    let currentObservedIndex = -1;
    let currentShowEpisodes = [];
    let currentShowName = "";
    let unlockedEpisodes = new Set();
    let lastTapTime = 0;
    let isVideoPlayingState = true;
    let ytPlayers = {};
    let progressTimers = {};

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatTimestamp(timestamp) {
      if (!timestamp) return "";
      const date = new Date(Number(timestamp));
      const hours = date.getHours();
      const minutes = date.getMinutes();
      const formattedMinutes = minutes < 10 ? '0' + minutes : minutes;
      const ampm = hours >= 12 ? 'PM' : 'AM';
      const formattedHours = hours % 12 || 12;
      
      const day = date.getDate();
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const month = monthNames[date.getMonth()];
      
      return `${day} ${month}, ${formattedHours}:${formattedMinutes} ${ampm}`;
    }

    function getYouTubeVideoId(value) {
      if (!value) return "";
      const v = value.trim();
      // Episodes must contain ONLY the YouTube video ID.
      return /^[A-Za-z0-9_-]{11}$/.test(v) ? v : "";
    }

     function formatVideoTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return "0:00";
      seconds = Math.floor(seconds);
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const sec = seconds % 60;
      return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${m}:${String(sec).padStart(2,'0')}`;
    }

    function toggleSearch() {
      const searchContainer = document.getElementById('search-bar');
      searchContainer.classList.toggle('active');
      if (searchContainer.classList.contains('active')) {
        setTimeout(() => document.getElementById('search-input').focus(), 100);
      }
    }

    function searchShows() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const filtered = allShowsData.filter(show => show.show_name.toLowerCase().includes(query));
      renderShows(filtered);
    }

    function parseCSVLine(line) {
      let delimiter = line.includes('\t') ? '\t' : ',';
      let result = [], current = '', inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        let char = line[i];
        if (char === '"') inQuotes = !inQuotes;
        else if (char === delimiter && !inQuotes) {
          result.push(current.trim().replace(/^"|"$/g, ''));
          current = '';
        } else current += char;
      }
      result.push(current.trim().replace(/^"|"$/g, ''));
      return result;
    }

    async function fetchShowsFromSheet() {
      const container = document.getElementById('shows-container');
      container.innerHTML = `<div class="state-message">Loading shows...</div>`;

      try {
        const response = await fetch(GOOGLE_SHEET_CSV_URL + '&t=' + new Date().getTime());
        if (!response.ok) throw new Error(`Sheet fetch failed`);
        const data = await response.text();
        const rows = data.split(/\r?\n/).map(r => r.trim()).filter(r => r.length > 0);

        let parsedMatrix = rows.map(r => parseCSVLine(r));
        let numCols = Math.max(...parsedMatrix.map(r => r.length));
        
        let showsMap = {};

        // Column 1 (B) se aage ke saare shows ke liye loop
        for (let col = 1; col < numCols; col++) {
          // Row index 1 = Show Name ('zbhs', 'hzhzh')
          let showName = parsedMatrix[1] && parsedMatrix[1][col] ? parsedMatrix[1][col].trim() : "";
          if (!showName) continue;

          // Row index 2 = Thumbnail Link
          let thumbnail = parsedMatrix[2] && parsedMatrix[2][col] ? parsedMatrix[2][col].trim() : "";
          let episodesList = [];

          // Sheet pattern: Row 4 = Episode 1 ID, Row 5 = Ad URL,
          // Row 6 = Episode 2 ID, Row 7 = Ad URL, ...
          for (let row = 3; row < parsedMatrix.length; row += 2) {
            const epVal = parsedMatrix[row] && parsedMatrix[row][col] ? parsedMatrix[row][col].trim() : "";
            const adVal = parsedMatrix[row + 1] && parsedMatrix[row + 1][col] ? parsedMatrix[row + 1][col].trim() : "";
            if (!epVal) continue;
            episodesList.push({ episode_id: epVal, ad_link: adVal });
          }

          if (showName) {
            showsMap[showName] = { show_name: showName, thumbnail: thumbnail, episodes: episodesList };
          }
        }

        allShowsData = Object.values(showsMap);

        if (allShowsData.length === 0) {
          container.innerHTML = `<div class="state-message">No shows found right now.</div>`;
          return;
        }

        renderShows(allShowsData);
      } catch (error) {
        container.innerHTML = `
          <div class="state-message error-message">
            Couldn't load shows. Please check your connection.<br>
            <button class="retry-btn" onclick="fetchShowsFromSheet()">Retry</button>
          </div>`;
      }
    }

    function renderShows(shows) {
      const container = document.getElementById('shows-container');
      container.innerHTML = "";

      if (shows.length === 0) {
        container.innerHTML = `<div class="state-message">No shows match your search.</div>`;
        return;
      }

      shows.forEach((show) => {
        const card = document.createElement('div');
        card.className = 'show-card';
        card.innerHTML = `
          <img src="${escapeHtml(show.thumbnail)}" alt="${escapeHtml(show.show_name)}" loading="lazy">
          <div class="show-details">
            <div class="show-title">${escapeHtml(show.show_name)}</div>
            <div class="show-episodes">${show.episodes.length} Episode(s)</div>
          </div>
        `;
        let realIndex = allShowsData.findIndex(s => s.show_name === show.show_name);
        card.onclick = () => openShortsPlayer(realIndex, 0);
        container.appendChild(card);
      });
    }

    function openShortsPlayer(showIndex, startEpisodeIndex = 0) {
      const show = allShowsData[showIndex];
      if (!show || show.episodes.length === 0) return;

      currentShowEpisodes = show.episodes;
      currentShowName = show.show_name;
      savedScrollPosition = window.scrollY;
      const container = document.getElementById('shortsContainer');
      container.innerHTML = "";
      container.scrollTop = 0;
      container.classList.remove('locked');

      if (activeAdCountdown) clearInterval(activeAdCountdown);
      currentObservedIndex = -1;
      
      unlockedEpisodes = new Set();
      for(let i=0; i<=startEpisodeIndex; i++) {
        unlockedEpisodes.add(i);
      }

      show.episodes.forEach((ep, i) => {
        const item = document.createElement('div');
        item.className = 'short-item';
        item.setAttribute('data-index', i);
        
        const isLiked = localStorage.getItem(`like_${currentShowName}_${i}`) === 'true';
        const isSaved = localStorage.getItem(`save_${currentShowName}_${i}`) === 'true';
        
        const adTypeInfo = detectAdType(ep.ad_link);
        let directAdSite = '#';
        if (adTypeInfo.type === 'youtube') directAdSite = `https://www.youtube.com/watch?v=${adTypeInfo.id}`;
        else if (adTypeInfo.type === 'instagram' || adTypeInfo.type === 'direct-link') directAdSite = ep.ad_link.trim();

        item.innerHTML = `
          <div class="video-wrapper" id="videoWrapper_${i}">
            <div class="swipe-overlay" onclick="handleVideoTap(${i})" id="swipeOverlay_${i}"></div>
            <div id="playerBox_${i}" style="width:100%; height:100%;"></div>

            <div class="floating-actions">
              <button class="action-btn ${isLiked ? 'active' : ''}" onclick="toggleLike('${escapeHtml(currentShowName)}', ${i}, this)">
                ❤️<span>Like</span>
              </button>
              <button class="action-btn ${isSaved ? 'active' : ''}" onclick="toggleSave('${escapeHtml(currentShowName)}', ${i}, this)">
                💾<span>Save</span>
              </button>
              <button class="action-btn" onclick="shareEpisode('${escapeHtml(currentShowName)}', ${i})">
                🔗<span>Share</span>
              </button>
            </div>

            <div class="ad-overlay-container">
              <a href="${escapeHtml(directAdSite)}" target="_blank" rel="noopener noreferrer" class="ad-learn-more-btn" id="adLearnMore_${i}">Learn More ➔</a>
              <div class="ad-skip-box hidden" id="adSkipBox_${i}" data-index="${i}" data-epid="${escapeHtml(ep.episode_id)}">
                <span class="ad-badge-tag">AD</span>
                <span id="adBtnText_${i}">3</span>
              </div>
            </div>
          </div>

          <div class="video-info-box">
            <div class="info-left">
              <div class="show-name-text">${escapeHtml(show.show_name)}</div>
              <div class="episode-name-text">Episode ${i + 1}</div>
              <div class="custom-progress">
                <div class="progress-times"><span id="currentTime_${i}">0:00</span><span id="totalTime_${i}">0:00</span></div>
                <div class="progress-track"><div class="progress-fill" id="progressFill_${i}"></div></div>
              </div>
            </div>
          </div>
        `;
        item.querySelector('.ad-skip-box').addEventListener('click', function () {
          handleSkipClick(Number(this.dataset.index), this.dataset.epid);
        });
        container.appendChild(item);
      });

      document.getElementById('shortsModal').classList.add('active');
      history.pushState({ modalOpen: true }, "");

      setupScrollObserver();

      if (startEpisodeIndex > 0) {
        setTimeout(() => {
          const targetItem = container.querySelector(`[data-index="${startEpisodeIndex}"]`);
          if (targetItem) targetItem.scrollIntoView({ behavior: 'auto' });
        }, 50);
      }
    }

    function handleVideoTap(index) {
      const currentTime = new Date().getTime();
      const tapLength = currentTime - lastTapTime;
      
      if (tapLength < 300 && tapLength > 0) {
        const likeBtn = document.querySelectorAll('.short-item')[index].querySelector('.action-btn');
        forceLike(currentShowName, index, likeBtn);
        showFloatingHeart(index);
        lastTapTime = 0;
      } else {
        lastTapTime = currentTime;
        setTimeout(() => {
          if (lastTapTime === currentTime) togglePlayPause(index);
        }, 300);
      }
    }

    function showFloatingHeart(index) {
      const wrapper = document.getElementById(`videoWrapper_${index}`);
      const heart = document.createElement('div');
      heart.className = 'floating-heart-anim';
      heart.innerHTML = '❤️';
      heart.style.left = `${Math.random() * 60 + 20}%`;
      heart.style.top = `${Math.random() * 40 + 30}%`;
      wrapper.appendChild(heart);
      setTimeout(() => heart.remove(), 800);
    }

    function togglePlayPause(index) {
      const player = ytPlayers[index];
      if (!player) return;
      try {
        const state = player.getPlayerState();
        if (state === YT.PlayerState.PLAYING) player.pauseVideo();
        else player.playVideo();
      } catch(e) {}
    }

    function setupScrollObserver() {
      const items = document.querySelectorAll('.short-item');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const index = parseInt(entry.target.getAttribute('data-index'));
            if (index !== currentObservedIndex) {
              currentObservedIndex = index;
              playEpisode(index);
            }
          }
        });
      }, { threshold: 0.6 });

      items.forEach(item => observer.observe(item));
    }

    function playEpisode(index) {
      if (activeAdCountdown) clearInterval(activeAdCountdown);
      const epData = currentShowEpisodes[index];
      if (!epData) return;

      document.querySelectorAll('[id^="playerBox_"]').forEach((box, i) => {
        if (i !== index) {
          if (ytPlayers[i] && ytPlayers[i].destroy) { try { ytPlayers[i].destroy(); } catch(e) {} }
          ytPlayers[i] = null;
          if (progressTimers[i]) { clearInterval(progressTimers[i]); progressTimers[i] = null; }
          box.innerHTML = "";
        }
        document.getElementById(`adSkipBox_${i}`).classList.add("hidden");
        document.getElementById(`adLearnMore_${i}`).classList.remove("active");
      });

      const container = document.getElementById('shortsContainer');
      isVideoPlayingState = true;

      saveHistory(currentShowName, index);

      if (index === 0 || unlockedEpisodes.has(index)) {
        container.classList.remove('locked');
        loadPlayerContent(index, epData.episode_id, false);
      } else {
        container.classList.add('locked');
        
        if (epData.ad_link && epData.ad_link.trim() !== "") {
          loadPlayerContent(index, epData.ad_link, true);
        } else {
          loadWelcomeBanner(index);
        }
        
        startAdCountdown(index, epData.episode_id);
      }
    }

    function getYouTubeIdFromUrl(value) {
      if (!value) return "";
      const v = value.trim();
      if (/^[A-Za-z0-9_-]{11}$/.test(v)) return v;
      const patterns = [
        /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/i,
        /[?&]v=([A-Za-z0-9_-]{11})/i
      ];
      for (const re of patterns) {
        const m = v.match(re);
        if (m) return m[1];
      }
      return "";
    }

    function getAdEmbedUrl(url) {
      if (!url) return "";
      const clean = url.trim();
      const ytId = getYouTubeIdFromUrl(clean);
      if (ytId) {
        // mute=1 is required by browsers to allow iframe autoplay without a user gesture.
        return `https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1&controls=0&rel=0&playsinline=1&iv_load_policy=3&fs=0&disablekb=1`;
      }
      // Instagram Reel/Post full URL -> embeddable URL when Instagram permits it.
      const ig = clean.match(/^https?:\/\/(?:www\.)?instagram\.com\/(reel|p|tv)\/([^/?#]+)/i);
      if (ig) return `https://www.instagram.com/${ig[1]}/${ig[2]}/embed/`;
      // Other URLs are attempted directly. Some websites intentionally block iframe embedding.
      return clean;
    }

    // Identify which kind of ad the sheet cell contains, so each type renders correctly.
    function detectAdType(raw) {
      if (!raw) return { type: 'none' };
      const val = raw.trim();
      if (!val) return { type: 'none' };

      // Banner-style ad networks (e.g. atOptions + invoke.js script tags) are pasted as full <script> blocks.
      if (/<script/i.test(val)) {
        let width = 728, height = 90;
        const wMatch = val.match(/['"]?width['"]?\s*:\s*(\d+)/i);
        const hMatch = val.match(/['"]?height['"]?\s*:\s*(\d+)/i);
        if (wMatch) width = parseInt(wMatch[1], 10);
        if (hMatch) height = parseInt(hMatch[1], 10);
        return { type: 'banner-script', content: val, width, height };
      }

      const ytId = getYouTubeIdFromUrl(val);
      if (ytId) return { type: 'youtube', id: ytId };

      const ig = val.match(/^https?:\/\/(?:www\.)?instagram\.com\/(reel|p|tv)\/([^/?#]+)/i);
      if (ig) return { type: 'instagram', url: `https://www.instagram.com/${ig[1]}/${ig[2]}/embed/` };

      // Any other plain http(s) link is treated as a direct / smart-link ad (CPM networks, offer walls, etc).
      // These commonly block iframing (X-Frame-Options/CSP), so they are shown as a tap-through card instead.
      if (/^https?:\/\//i.test(val)) return { type: 'direct-link', url: val };

      return { type: 'invalid' };
    }

    function loadPlayerContent(index, idOrUrl, isAd) {
      const box = document.getElementById(`playerBox_${index}`);
      if (!box) return;

      if (isAd) {
        const adInfo = detectAdType(idOrUrl);

        if (adInfo.type === 'youtube') {
          const url = getAdEmbedUrl(idOrUrl);
          box.innerHTML = `<iframe class="ad-frame" src="${escapeHtml(url)}" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
          return;
        }

        if (adInfo.type === 'instagram') {
          box.innerHTML = `<iframe class="ad-frame" id="igAdFrame_${index}" src="${escapeHtml(adInfo.url)}" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
          // Instagram embeds frequently fail to autoplay/load inside an iframe. If it hasn't shown
          // anything usable shortly after loading, fall back to the welcome banner instead of a blank screen.
          setTimeout(() => {
            const stillOnAd = document.getElementById(`igAdFrame_${index}`);
            if (stillOnAd) loadWelcomeBanner(index);
          }, 3500);
          return;
        }

        if (adInfo.type === 'banner-script') {
          const srcdocHtml = `<!DOCTYPE html><html><head><style>html,body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;background:#0b0b0e;overflow:hidden;}</style></head><body>${adInfo.content}</body></html>`;
          box.innerHTML = `
            <div class="banner-ad-wrapper">
              <div class="banner-ad-tag">Advertisement</div>
              <iframe class="banner-ad-frame" style="width:${adInfo.width}px;height:${adInfo.height}px;" srcdoc="${escapeHtml(srcdocHtml)}" sandbox="allow-scripts allow-popups allow-popups-to-escape-sandbox" scrolling="no"></iframe>
            </div>`;
          return;
        }

        if (adInfo.type === 'direct-link') {
          box.innerHTML = `
            <div class="direct-ad-card">
              <div class="direct-ad-badge">SPONSORED</div>
              <div class="direct-ad-title">Your episode unlocks after this</div>
              <div class="direct-ad-sub">Tap below to view the sponsor's page, then come back to continue watching.</div>
              <a class="direct-ad-tap-btn" href="${escapeHtml(adInfo.url)}" target="_blank" rel="noopener noreferrer">View Ad ➔</a>
            </div>`;
          return;
        }

        // Invalid / unrecognised ad value.
        loadWelcomeBanner(index);
        return;
          }
 const videoId = getYouTubeVideoId(idOrUrl);
      if (!videoId) {
        box.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100%;color:#aaa;font-size:14px;text-align:center;padding:20px">Invalid YouTube video ID.<br>Episode cell must contain only the 11-character YouTube ID.</div>';
        return;
      }

      box.innerHTML = `<div id="ytPlayer_${index}" style="width:100%;height:100%"></div>`;

      const create = () => {
        if (!window.YT || !YT.Player) { setTimeout(create, 150); return; }
        if (ytPlayers[index] && ytPlayers[index].destroy) { try { ytPlayers[index].destroy(); } catch(e) {} }
        ytPlayers[index] = new YT.Player(`ytPlayer_${index}`, {
          videoId,
          playerVars: {
            autoplay: 1, controls: 0, rel: 0, modestbranding: 1,
            playsinline: 1, iv_load_policy: 3, fs: 0, disablekb: 1,
            cc_load_policy: 0, showinfo: 0
          },
          events: {
            onReady: (event) => {
              try { event.target.setOption && event.target.setOption('captions', 'track', {}); } catch(e) {}
              try { event.target.playVideo(); } catch(e) {}
              startProgressTracking(index);
            },
            onStateChange: (event) => {
              if (event.data === YT.PlayerState.PLAYING) startProgressTracking(index);
            }
          }
        });
      };
      create();
    }

    function startProgressTracking(index) {
      if (progressTimers[index]) clearInterval(progressTimers[index]);
      progressTimers[index] = setInterval(() => {
        const p = ytPlayers[index];
        if (!p || !p.getCurrentTime) return;
        let current = 0, total = 0;
        try { current = p.getCurrentTime() || 0; total = p.getDuration() || 0; } catch(e) {}
        const curEl = document.getElementById(`currentTime_${index}`);
        const totalEl = document.getElementById(`totalTime_${index}`);
        const fillEl = document.getElementById(`progressFill_${index}`);
        if (curEl) curEl.textContent = formatVideoTime(current);
        if (totalEl) totalEl.textContent = total > 0 ? formatVideoTime(total) : 'LIVE';
        if (fillEl) fillEl.style.width = total > 0 ? `${Math.min(100, (current / total) * 100)}%` : '0%';
      }, 250);
    }

    function loadWelcomeBanner(index) {
      const box = document.getElementById(`playerBox_${index}`);
      box.innerHTML = `
        <div class="welcome-ad-banner">
          <div class="welcome-logo-box"><img src="icon.png" alt="HRS"></div>
          <div class="welcome-title">Welcome to HR STUDIO</div>
          <div class="welcome-sub">Enjoy your premium episodes shortly</div>
        </div>
      `;
    }

    function startAdCountdown(index, actualEpisodeId) {
      const skipBox = document.getElementById(`adSkipBox_${index}`);
      const btnText = document.getElementById(`adBtnText_${index}`);
      const learnMoreBtn = document.getElementById(`adLearnMore_${index}`);

      skipBox.classList.remove('hidden');
      skipBox.classList.add('disabled');
      
      const currentEpObj = currentShowEpisodes[index];
      const adInfo = currentEpObj ? detectAdType(currentEpObj.ad_link) : { type: 'none' };
      // Only show Learn More for ad types that actually have a clickable destination URL
      // (a banner-script ad is clickable inside its own iframe, so no separate link is needed).
      if (adInfo.type === 'youtube' || adInfo.type === 'instagram' || adInfo.type === 'direct-link') {
        learnMoreBtn.classList.add('active');
      }
      
      let count = 3;
      btnText.innerText = `${count}`;

      activeAdCountdown = setInterval(() => {
        count--;
        if (count > 0) {
          btnText.innerText = `${count}`;
        } else {
          clearInterval(activeAdCountdown);
          btnText.innerText = `Skip ➔`;
          skipBox.classList.remove('disabled');
          document.getElementById('shortsContainer').classList.remove('locked');
        }
      }, 1000);
    }

    function handleSkipClick(index, episodeId) {
      const skipBox = document.getElementById(`adSkipBox_${index}`);
      if (skipBox.classList.contains('disabled')) return;

      skipBox.classList.add('hidden');
      document.getElementById(`adLearnMore_${index}`).classList.remove('active');
      unlockedEpisodes.add(index);
      document.getElementById('shortsContainer').classList.remove('locked');
      loadPlayerContent(index, episodeId, false);
      saveHistory(currentShowName, index);
    }

    function closeShortsPlayer() {
      if (activeAdCountdown) clearInterval(activeAdCountdown);
      document.getElementById('shortsModal').classList.remove('active');
      Object.keys(ytPlayers).forEach(i => { if (ytPlayers[i] && ytPlayers[i].destroy) { try { ytPlayers[i].destroy(); } catch(e) {} } });
      Object.keys(progressTimers).forEach(i => clearInterval(progressTimers[i]));
      ytPlayers = {};
      progressTimers = {};
      document.getElementById('shortsContainer').innerHTML = "";
      currentObservedIndex = -1;
      window.scrollTo(0, savedScrollPosition);
    }

    window.onpopstate = function () {
      if (document.getElementById('shortsModal').classList.contains('active')) {
        closeShortsPlayer();
      } else if (document.getElementById('historyPageView').classList.contains('active')) {
        closeHistoryWindow();
      }
    };

    function handleFooterClick(tab) {
      document.querySelectorAll('.footer-item').forEach(el => el.classList.remove('active'));

      if (tab === 'home') {
        document.getElementById('footerHome').classList.add('active');
        closeShortsPlayer();
        closeHistoryWindow();
        window.location.reload();
      } else if (tab === 'share') {
        document.getElementById('footerShare').classList.add('active');
        handleAppShareOrInstall();
      } else if (tab === 'history') {
        document.getElementById('footerHistory').classList.add('active');
        openHistoryWindow();
      }
    }

    function handleAppShareOrInstall() {
      const shareData = {
        title: 'HR STUDIO',
        text: 'Watch your favorite shows and episodes on HR STUDIO!',
        url: window.location.href
      };
      if (navigator.share) {
        navigator.share(shareData).catch(() => {});
      } else {
        alert("HR STUDIO App Link copied!");
      }
    }

    function toggleLike(showName, epIndex, btn) {
      const key = `like_${showName}_${epIndex}`;
      const current = localStorage.getItem(key) === 'true';
      localStorage.setItem(key, !current);
      if(btn) btn.classList.toggle('active', !current);
      updateHistoryStorageArray('likes', showName, epIndex, !current);
    }

    function forceLike(showName, epIndex, btn) {
      const key = `like_${showName}_${epIndex}`;
      localStorage.setItem(key, 'true');
      if(btn) btn.classList.add('active');
      updateHistoryStorageArray('likes', showName, epIndex, true);
    }

    function toggleSave(showName, epIndex, btn) {
      const key = `save_${showName}_${epIndex}`;
      const current = localStorage.getItem(key) === 'true';
      localStorage.setItem(key, !current);
      if(btn) btn.classList.toggle('active', !current);
      updateHistoryStorageArray('saves', showName, epIndex, !current);
    }

    function shareEpisode(showName, epIndex) {
      const shareText = `Check out ${showName} - Episode ${epIndex + 1} on HR STUDIO!`;
      if (navigator.share) {
        navigator.share({ title: showName, text: shareText, url: window.location.href }).catch(() => {});
      } else {
        alert(shareText);
      }
    }

    function saveHistory(showName, epIndex) {
      let historyList = JSON.parse(localStorage.getItem('hr_watch_history') || '[]');
      historyList = historyList.filter(item => !(item.showName === showName && item.epIndex === epIndex));
      historyList.unshift({ showName, epIndex, timestamp: Date.now() });
      localStorage.setItem('hr_watch_history', JSON.stringify(historyList));
    }

    function updateHistoryStorageArray(type, showName, epIndex, add) {
      let key = type === 'likes' ? 'hr_liked_items' : 'hr_saved_items';
      let list = JSON.parse(localStorage.getItem(key) || '[]');
      list = list.filter(item => !(item.showName === showName && item.epIndex === epIndex));
      if (add) list.unshift({ showName, epIndex, timestamp: Date.now() });
      localStorage.setItem(key, JSON.stringify(list));
    }

    function playFromHistory(showName, epIndex) {
      closeHistoryWindow();
      let showIdx = allShowsData.findIndex(s => s.show_name === showName);
      if (showIdx !== -1) {
        openShortsPlayer(showIdx, epIndex);
      } else {
        alert("Show not found.");
      }
    }

    function buildHCard(item) {
      let showObj = allShowsData.find(s => s.show_name === item.showName);
      let thumb = showObj ? showObj.thumbnail : 'icon.png';
      let formattedTime = formatTimestamp(item.timestamp);
      return `
        <div class="h-card-item" onclick="playFromHistory('${escapeHtml(item.showName)}', ${item.epIndex})">
          <div class="h-card-thumb-wrapper">
            <img class="h-card-thumb" src="${escapeHtml(thumb)}" alt="" loading="lazy">
            ${formattedTime ? `<div class="h-card-time-tag">${escapeHtml(formattedTime)}</div>` : ''}
          </div>
          <div class="h-card-info">
            <div class="h-card-title">${escapeHtml(item.showName)}</div>
            <div class="h-card-subtitle">Ep ${item.epIndex + 1}</div>
          </div>
        </div>`;
    }

    function openHistoryWindow() {
      const pageView = document.getElementById('historyPageView');
      const body = document.getElementById('historyContentBody');

      let historyList = JSON.parse(localStorage.getItem('hr_watch_history') || '[]');
      let savedList = JSON.parse(localStorage.getItem('hr_saved_items') || '[]');
      let likedList = JSON.parse(localStorage.getItem('hr_liked_items') || '[]');

      const watchHTML = historyList.map(buildHCard).join('') || '<div class="history-empty-msg">No watch history yet.</div>';
      const savedHTML = savedList.map(buildHCard).join('') || '<div class="history-empty-msg">No saved episodes found.</div>';
      const likedHTML = likedList.map(buildHCard).join('') || '<div class="history-empty-msg">No liked episodes found.</div>';

      body.innerHTML = `
        <div class="history-tab-panel active" data-panel="watch">
          <div class="history-grid-row">${watchHTML}</div>
        </div>
        <div class="history-tab-panel" data-panel="saved">
          <div class="history-grid-row">${savedHTML}</div>
        </div>
        <div class="history-tab-panel" data-panel="liked">
          <div class="history-grid-row">${likedHTML}</div>
        </div>
      `;

      document.querySelectorAll('.history-tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector('.history-tab-btn[data-tab="watch"]').classList.add('active');

      pageView.classList.add('active');
      history.pushState({ historyOpen: true }, "");
    }

    function switchHistoryTab(tab) {
      document.querySelectorAll('.history-tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tab));
      document.querySelectorAll('.history-tab-panel').forEach(panel => panel.classList.toggle('active', panel.dataset.panel === tab));
    }

    function closeHistoryWindow() {
      document.getElementById('historyPageView').classList.remove('active');
      document.getElementById('footerHome').classList.add('active');
      document.getElementById('footerHistory').classList.remove('active');
    }

    window.onload = fetchShowsFromSheet;
  </script>
</body>
</html>
