  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0b0e; color: #fff; overflow-x: hidden; padding-bottom: 70px; }

    /* Splash Screen */
    #splash-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: #000; display: flex; justify-content: center; align-items: center;
      z-index: 9999; animation: fadeOut 0.8s ease 2.2s forwards;
    }
    .splash-logo-box {
      width: 120px; height: 120px; border-radius: 24px; overflow: hidden;
      box-shadow: 0 10px 35px rgba(255, 0, 85, 0.5);
      animation: zoomPulse 1.5s ease-in-out infinite alternate;
    }
    .splash-logo-box img { width: 100%; height: 100%; object-fit: cover; }
    @keyframes zoomPulse { 0% { transform: scale(0.85); } 100% { transform: scale(1.05); } }
    @keyframes fadeOut { 100% { opacity: 0; visibility: hidden; } }

    /* Header */
    header {
      position: sticky; top: 0; background: rgba(11, 11, 14, 0.95);
      backdrop-filter: blur(16px); z-index: 100; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 16px;
    }
    .nav-top { display: flex; align-items: center; justify-content: space-between; max-width: 800px; margin: 0 auto; }
    .brand-left { display: flex; align-items: center; gap: 10px; }
    .brand-logo-img { width: 36px; height: 36px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,0,85,0.4); }
    .brand-logo-img img { width: 100%; height: 100%; object-fit: cover; }
    .brand-title { font-size: 18px; font-weight: 900; background: linear-gradient(135deg, #ff0055, #00e5ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .search-btn-icon {
      background: #141419; border: 1px solid rgba(255, 255, 255, 0.1);
      color: #aaa; width: 38px; height: 38px; border-radius: 50%; display: flex;
      justify-content: center; align-items: center; cursor: pointer; font-size: 15px;
      transition: all 0.2s ease;
    }
    .search-btn-icon:hover { border-color: #ff0055; color: #fff; }

    .search-container { display: none; padding: 12px 0 0 0; max-width: 800px; margin: 0 auto; }
    .search-container.active { display: block; }
    .search-box-wrapper input {
      width: 100%; padding: 12px 16px; background: #141419;
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 12px; color: #fff; outline: none;
      font-size: 14px; transition: border-color 0.2s;
    }
    .search-box-wrapper input:focus { border-color: #ff0055; }

    /* Fullscreen Reels Modal */
    .shorts-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: #000; z-index: 1000;
    }
    .shorts-modal.active { display: block; }
    
    .shorts-container {
      height: 100vh; width: 100%; overflow-y: scroll;
      scroll-snap-type: y mandatory; -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    .shorts-container.locked { overflow-y: hidden; }

    .short-item {
      height: 100vh; width: 100%; scroll-snap-align: start; scroll-snap-stop: always;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      position: relative; background: #000; padding: 0;
    }

    /* Video Player Area */
    .video-wrapper {
      position: relative; width: 100%; height: 75vh;
      display: flex; justify-content: center; align-items: center;
      overflow: hidden; background: #000;
    }
    .video-wrapper iframe {
      width: 100%; height: 100%; border: none; object-fit: cover; pointer-events: none;
    }
    .swipe-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
    }

    /* Floating Heart Animation on Double Tap */
    .floating-heart-anim {
      position: absolute; font-size: 60px; color: #ff0055; z-index: 40;
      animation: heartPop 0.8s ease-out forwards; pointer-events: none;
      text-shadow: 0 0 20px rgba(255,0,85,0.8);
    }
    @keyframes heartPop {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1) translateY(-60px); opacity: 0; }
    }

    /* Instagram Style Floating Action Buttons */
    .insta-actions {
      position: absolute; right: 15px; bottom: 120px;
      display: flex; flex-direction: column; align-items: center;
      gap: 18px; z-index: 40;
    }

    .insta-action-btn {
      background: none; border: none; color: #fff;
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer; padding: 0;
    }

    .insta-action-btn .icon {
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
      transition: transform 0.2s ease, fill 0.2s, stroke 0.2s;
    }

    .action-count, .action-text {
      font-size: 12px; font-weight: 600; margin-top: 4px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    .insta-action-btn.liked svg {
      fill: #ff3040; stroke: #ff3040; transform: scale(1.15);
    }

    .insta-action-btn.saved svg {
      fill: #fff; stroke: #fff; transform: scale(1.15);
    }

    /* Ad Overlay & Skip */
    .ad-overlay-container {
      position: absolute; bottom: 25px; right: 15px; z-index: 50;
      display: flex; gap: 8px; align-items: center;
    }
    .ad-skip-box {
      background: rgba(0, 0, 0, 0.85); border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 700;
      color: #fff; backdrop-filter: blur(5px); cursor: pointer;
      display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .ad-skip-box.hidden { display: none !important; }
    .ad-skip-box.disabled { opacity: 0.8; cursor: not-allowed; border-color: rgba(255, 0, 85, 0.6); }
    .ad-badge-tag { background: #ff0055; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 800; }

    .ad-learn-more-btn {
      background: linear-gradient(135deg, #0070f3, #00c6ff); color: #fff; border: none; padding: 10px 16px;
      border-radius: 8px; font-size: 13px; font-weight: 800; cursor: pointer;
      text-decoration: none; box-shadow: 0 4px 15px rgba(0, 112, 243, 0.4);
      display: none; align-items: center; gap: 4px; backdrop-filter: blur(5px);
    }
    .ad-learn-more-btn.active { display: flex; }

    /* Custom video progress */
    .custom-progress { width:100%; margin-top:9px; pointer-events:none; }
    .progress-times { display:flex; justify-content:space-between; align-items:center; font-size:11px; font-weight:700; color:#fff; text-shadow:0 1px 4px #000; margin-bottom:5px; }
    .progress-track { width:100%; height:3px; background:rgba(255,255,255,.28); border-radius:99px; overflow:hidden; }
    .progress-fill { width:0%; height:100%; background:#fff; border-radius:99px; transition:width .15s linear; }

    /* Sponsor Direct Link Card - Only Tap Here Button */
    .direct-ad-card {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 25; background: #111; padding: 30px 20px;
      border-radius: 16px; text-align: center; max-width: 320px; width: 85%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .direct-ad-badge { 
      background: #ff0055; color: #fff; padding: 4px 12px; font-size: 11px; 
      font-weight: bold; border-radius: 20px; display: inline-block; margin-bottom: 12px; letter-spacing: 1px; 
    }
    .direct-ad-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; color: #fff; }
    .direct-ad-sub { font-size: 13px; color: #aaa; line-height: 1.4; margin-bottom: 20px; }

    .direct-ad-btn {
      display: inline-block; background: linear-gradient(135deg, #0070f3, #00c6ff);
      color: #fff; text-decoration: none; padding: 12px 24px; font-size: 14px;
      font-weight: bold; border-radius: 30px; box-shadow: 0 4px 15px rgba(0, 112, 243, 0.4);
      transition: transform 0.2s ease; text-align: center; width: 100%;
    }
    .direct-ad-btn:active { transform: scale(0.95); }

    /* Video Info Section */
    .video-info-box { 
      width: 100%; padding: 12px 20px 16px; background: #0b0b0e;
      display: flex; justify-content: space-between; align-items: center;
    }
    .info-left { display: flex; flex-direction: column; width: 100%; }
    .show-name-text { font-size: 16px; font-weight: 800; color: #fff; }
    .episode-name-text { font-size: 13px; color: #ff0055; font-weight: 700; margin-top: 2px; }

    /* Grid Layout */
    .container { padding: 20px 16px; max-width: 800px; margin: 0 auto; }
    .grid-layout { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .show-card { background: #141419; border-radius: 14px; overflow: hidden; cursor: pointer; border: 1px solid rgba(255,255,255,0.06); }
    .show-card img { width: 100%; height: 220px; object-fit: cover; display: block; }
    .show-details { padding: 12px; }
    .show-title { font-size: 15px; font-weight: 700; color: #fff; }
    .show-episodes { font-size: 12px; color: #ff0055; margin-top: 4px; font-weight: 600; }

    /* History Separate Window */
    .history-page-view {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: #0b0b0e; z-index: 1500; overflow-y: auto; padding: 20px 16px 80px 16px;
    }
    .history-page-view.active { display: block; }
    
    .history-header-bar {
      display: flex; align-items: center; justify-content: space-between; max-width: 800px; margin: 0 auto 20px auto;
      border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 12px; position: relative;
    }
    .history-back-btn { font-size: 20px; font-weight: 700; color: #ff0055; cursor: pointer; }
    .history-page-title { font-size: 18px; font-weight: 900; color: #fff; position: absolute; left: 50%; transform: translateX(-50%); }
    .history-content-container { max-width: 800px; margin: 0 auto; }

    .history-tabs-row {
      display: flex; gap: 8px; background: #141419; border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px; padding: 5px; margin-bottom: 18px;
    }
    .history-tab-btn {
      flex: 1; text-align: center; padding: 10px 8px; border-radius: 10px; cursor: pointer;
      font-size: 13px; font-weight: 800; color: rgba(255,255,255,0.55); transition: all 0.2s ease;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .history-tab-btn.active { background: linear-gradient(135deg, #ff0055, #ff3377); color: #fff; box-shadow: 0 4px 14px rgba(255,0,85,0.35); }
    .history-tab-panel { display: none; }
    .history-tab-panel.active { display: block; }

    .history-grid-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .h-card-item {
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px; overflow: hidden; cursor: pointer;
      transition: transform 0.2s, border-color 0.2s; position: relative;
    }
    .h-card-item:hover { border-color: #ff0055; transform: translateY(-2px); }
    .h-card-thumb-wrapper { position: relative; width: 100%; height: 130px; background: #000; }
    .history-empty-msg { grid-column: 1 / -1; font-size: 12px; color: rgba(255,255,255,0.4); padding: 30px 0; text-align: center; }
    .h-card-thumb { width: 100%; height: 100%; object-fit: cover; display: block; }
    .h-card-time-tag {
      position: absolute; bottom: 6px; left: 6px; background: rgba(0, 0, 0, 0.75);
      color: #00e5ff; font-size: 9px; font-weight: 700; padding: 2px 6px;
      border-radius: 4px; backdrop-filter: blur(2px); border: 1px solid rgba(0,229,255,0.3);
    }
    .h-card-info { padding: 8px; }
    .h-card-title { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .h-card-subtitle { font-size: 11px; color: #ff0055; font-weight: 600; margin-top: 2px; }

    /* Footer App Navigation */
    .app-footer {
      position: fixed; bottom: 0; left: 0; width: 100%; background: #111115;
      border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex;
      justify-content: space-around; align-items: center; padding: 12px 0; z-index: 90;
    }
    .footer-item {
      display: flex; flex-direction: column; align-items: center; color: rgba(255, 255, 255, 0.6);
      font-size: 12px; cursor: pointer; text-decoration: none; gap: 4px; font-weight: 600;
    }
    .footer-item.active { color: #ff0055; }
    .footer-item svg { width: 20px; height: 20px; fill: currentColor; }

    .state-message {
      grid-column: 1 / -1; text-align: center; color: rgba(255,255,255,0.6);
      font-size: 14px; padding: 40px 10px;
    }
    .state-message.error-message { color: #ff0055; }
    .retry-btn {
      margin-top: 12px; background: rgba(255,0,85,0.15); border: 1px solid rgba(255,0,85,0.5);
      color: #fff; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: 700; font-size: 13px;
    }

    /* Toast Notification */
    #toastNotification {
      visibility: hidden; min-width: 250px; background-color: rgba(28, 28, 30, 0.95);
      color: #fff; text-align: center; border-radius: 30px; padding: 12px 20px;
      position: fixed; z-index: 9999; left: 50%; top: 30px;
      transform: translateX(-50%) translateY(-20px); font-size: 14px; font-weight: 500;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1); display: flex; align-items: center;
      justify-content: center; gap: 10px; opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
    }
    #toastNotification.show { visibility: visible; opacity: 1; transform: translateX(-50%) translateY(0); }
    #toastNotification svg { fill: #4cd964; flex-shrink: 0; }

  <script>
    const JM_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTXtzbDoOjeXakc4hA_OS2wtQTSP3iS4TVfEDNsRM8lZUoVqnktOrjOxvjl02zSOba4R4Uehf9OaONb/pub?gid=0&single=true&output=csv";
    const MASSAGE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTXtzbDoOjeXakc4hA_OS2wtQTSP3iS4TVfEDNsRM8lZUoVqnktOrjOxvjl02zSOba4R4Uehf9OaONb/pub?gid=304283440&single=true&output=csv";

    let allShowsData = [];
    let savedScrollPosition = 0;
    let activeAdCountdown = null;
    let currentObservedIndex = -1;
    let currentShowEpisodes = [];
    let currentShowName = "";
    let unlockedEpisodes = new Set();
    let lastTapTime = 0;
    let ytPlayers = {};
    let progressTimers = {};

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

     function formatTimestamp(timestamp) {
      if (!timestamp) return "";
      const date = new Date(Number(timestamp));
      const hours = date.getHours();
      const minutes = date.getMinutes();
      const formattedMinutes = minutes < 10 ? '0' + minutes : minutes;
      const ampm = hours >= 12 ? 'PM' : 'AM';
      const formattedHours = hours % 12 || 12;
      const day = date.getDate();
      const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const month = monthNames[date.getMonth()];
      return `${day} ${month}, ${formattedHours}:${formattedMinutes} ${ampm}`;
    }

    function getYouTubeVideoId(value) {
      if (!value) return "";
      const v = value.trim();
      return /^[A-Za-z0-9_-]{11}$/.test(v) ? v : "";
    }

     function formatVideoTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) return "0:00";
      seconds = Math.floor(seconds);
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const sec = seconds % 60;
      return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${m}:${String(sec).padStart(2,'0')}`;
    }

    function toggleSearch() {
      const searchContainer = document.getElementById('search-bar');
      searchContainer.classList.toggle('active');
      if (searchContainer.classList.contains('active')) {
        setTimeout(() => document.getElementById('search-input').focus(), 100);
      }
    }

    function searchShows() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const filtered = allShowsData.filter(show => show.show_name.toLowerCase().includes(query));
      renderShows(filtered);
    }

    function parseCSVLine(line) {
      let delimiter = line.includes('\t') ? '\t' : ',';
      let result = [], current = '', inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        let char = line[i];
        if (char === '"') inQuotes = !inQuotes;
        else if (char === delimiter && !inQuotes) {
          result.push(current.trim().replace(/^"|"$/g, ''));
          current = '';
        } else current += char;
      }
      result.push(current.trim().replace(/^"|"$/g, ''));
      return result;
    }

    async function fetchShowsFromSheet() {
      const container = document.getElementById('shows-container');
      container.innerHTML = `<div class="state-message">Loading shows...</div>`;

      try {
        const response = await fetch(JM_URL + '&t=' + new Date().getTime());
        if (!response.ok) throw new Error(`Sheet fetch failed`);
        const data = await response.text();
        const rows = data.split(/\r?\n/).map(r => r.trim()).filter(r => r.length > 0);

        let parsedMatrix = rows.map(r => parseCSVLine(r));
        let numCols = Math.max(...parsedMatrix.map(r => r.length));
        let showsMap = {};

        for (let col = 1; col < numCols; col++) {
          let showName = parsedMatrix[1] && parsedMatrix[1][col] ? parsedMatrix[1][col].trim() : "";
          if (!showName) continue;

          let thumbnail = parsedMatrix[2] && parsedMatrix[2][col] ? parsedMatrix[2][col].trim() : "";
          let episodesList = [];

          for (let row = 3; row < parsedMatrix.length; row += 2) {
            const epVal = parsedMatrix[row] && parsedMatrix[row][col] ? parsedMatrix[row][col].trim() : "";
            const adVal = parsedMatrix[row + 1] && parsedMatrix[row + 1][col] ? parsedMatrix[row + 1][col].trim() : "";
            if (!epVal) continue;
            episodesList.push({ episode_id: epVal, ad_link: adVal });
          }

          if (showName) {
            showsMap[showName] = { show_name: showName, thumbnail: thumbnail, episodes: episodesList };
          }
        }

        allShowsData = Object.values(showsMap);

        if (allShowsData.length === 0) {
          container.innerHTML = `<div class="state-message">No shows found right now.</div>`;
          return;
        }

        renderShows(allShowsData);
      } catch (error) {
        container.innerHTML = `
          <div class="state-message error-message">
            Couldn't load shows. Please check your connection.<br>
            <button class="retry-btn" onclick="fetchShowsFromSheet()">Retry</button>
          </div>`;
      }
    }

        card.onclick = () => openShortsPlayer(realIndex, 0);
        container.appendChild(card);
      });

    function getEpisodeLikesCount(showName, epIndex) {
      let hash = 0;
      let str = showName + "_" + epIndex;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      let randomNum = Math.abs(hash) % 9900000 + 100000;
      if (randomNum >= 1000000) {
        return (randomNum / 1000000).toFixed(1) + 'M';
      } else {
        return (randomNum / 1000).toFixed(0) + 'K';
      }
    }

    function handleVideoTap(index) {

        lastTapTime = 0;

    function togglePlayPause(index) {

        else player.playVideo();

    }

    function setupScrollObserver() {
      const items = document.querySelectorAll('.short-item');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const index = parseInt(entry.target.getAttribute('data-index'));
            if (index !== currentObservedIndex) {
              currentObservedIndex = index;
              playEpisode(index);
            }
          }
        });
      }, { threshold: 0.6 });

      items.forEach(item => observer.observe(item));
    }

          if (ytPlayers[i] && ytPlayers[i].destroy) { try { ytPlayers[i].destroy(); } catch(e) {} }
          ytPlayers[i] = null;
          if (progressTimers[i]) { clearInterval(progressTimers[i]); progressTimers[i] = null; }
          box.innerHTML = "";

    function getYouTubeIdFromUrl(value) {
      if (!value) return "";
      const v = value.trim();
      if (/^[A-Za-z0-9_-]{11}$/.test(v)) return v;
      const patterns = [
        /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/|v\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/i,
        /[?&]v=([A-Za-z0-9_-]{11})/i
      ];
      for (const re of patterns) {
        const m = v.match(re);
        if (m) return m[1];
      }
      return "";
    }

    function detectAdType(raw) {
      if (!raw) return { type: 'none' };
      const val = raw.trim();
      if (!val) return { type: 'none' };

      const ytId = getYouTubeIdFromUrl(val);
      if (ytId) return { type: 'youtube', id: ytId, url: `https://www.youtube.com/watch?v=${ytId}` };

      const ig = val.match(/^https?:\/\/(?:www\.)?instagram\.com\/(reel|p|tv)\/([^/?#]+)/i);
      if (ig) return { type: 'instagram', url: val, embedUrl: `https://www.instagram.com/${ig[1]}/${ig[2]}/embed/` };

      if (/^https?:\/\//i.test(val)) return { type: 'direct-link', url: val };

      return { type: 'sponsor-card', url: "#" };
    }

    function loadPlayerContent(index, idOrUrl, isAd) {
      const box = document.getElementById(`playerBox_${index}`);
      if (!box) return;

      if (isAd) {
        const adInfo = detectAdType(idOrUrl);

        // अगर स्पॉन्सर कार्ड है या डायरेक्ट लिंक है (जो वीडियो नहीं है)
        if (adInfo.type === 'direct-link' || adInfo.type === 'sponsor-card') {
          loadSponsorBanner(index, adInfo.url);
          return;
        }

        // अगर यूट्यूब वीडियो एड है
        if (adInfo.type === 'youtube') {
          box.innerHTML = `<iframe class="ad-frame" src="${escapeHtml(`https://www.youtube.com/embed/${adInfo.id}?autoplay=1&mute=1&controls=0&rel=0&playsinline=1`)}" allow="autoplay; encrypted-media; fullscreen"></iframe>`;
          setupLearnMoreButton(index, adInfo.url);
          return;
        }

        // अगर इंस्टाग्राम वीडियो एड है
        if (adInfo.type === 'instagram') {
          box.innerHTML = `<iframe class="ad-frame" src="${escapeHtml(adInfo.embedUrl)}" allow="autoplay; encrypted-media; fullscreen"></iframe>`;
          setupLearnMoreButton(index, adInfo.url);
          return;
        }

        loadSponsorBanner(index, idOrUrl);
        return;
      }

      const videoId = getYouTubeVideoId(idOrUrl);
      if (!videoId) {
        box.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100%;color:#aaa;font-size:14px;text-align:center;padding:20px">Invalid YouTube video ID.</div>';
        return;
      }

      box.innerHTML = `<div id="ytPlayer_${index}" style="width:100%;height:100%"></div>`;

      const create = () => {
        if (!window.YT || !YT.Player) { setTimeout(create, 150); return; }
        if (ytPlayers[index] && ytPlayers[index].destroy) { try { ytPlayers[index].destroy(); } catch(e) {} }
        ytPlayers[index] = new YT.Player(`ytPlayer_${index}`, {
          videoId,
          playerVars: {
            autoplay: 1, controls: 0, rel: 0, modestbranding: 1,
            playsinline: 1, iv_load_policy: 3, fs: 0, disablekb: 1
          },
          events: {
            onReady: (event) => {
              try { event.target.playVideo(); } catch(e) {}
              startProgressTracking(index);
            },
            onStateChange: (event) => {
              if (event.data === YT.PlayerState.PLAYING) startProgressTracking(index);
            }
          }
        });
      };
      create();
    }

     function setupLearnMoreButton(index, linkUrl) {
      const lmBtn = document.getElementById(`adLearnMore_${index}`);
      if (lmBtn) {
        lmBtn.href = (linkUrl && linkUrl !== "#") ? linkUrl : "#";
        lmBtn.classList.add('active');
      }
    }

    function startProgressTracking(index) {
      if (progressTimers[index]) clearInterval(progressTimers[index]);
      progressTimers[index] = setInterval(() => {
        const p = ytPlayers[index];
        if (!p || !p.getCurrentTime) return;
        let current = 0, total = 0;
        try { current = p.getCurrentTime() || 0; total = p.getDuration() || 0; } catch(e) {}
        const curEl = document.getElementById(`currentTime_${index}`);
        const totalEl = document.getElementById(`totalTime_${index}`);
        const fillEl = document.getElementById(`progressFill_${index}`);
        if (curEl) curEl.textContent = formatVideoTime(current);
        if (totalEl) totalEl.textContent = total > 0 ? formatVideoTime(total) : 'LIVE';
        if (fillEl) fillEl.style.width = total > 0 ? `${Math.min(100, (current / total) * 100)}%` : '0%';
      }, 250);
    }

    function loadSponsorBanner(index, linkUrl = "#") {
      const box = document.getElementById(`playerBox_${index}`);
      const validLink = (linkUrl && linkUrl.trim() !== "" && linkUrl !== "#") ? linkUrl : "#";
      
      box.innerHTML = `
        <div class="direct-ad-card">
          <div class="direct-ad-badge">SPONSORED</div>
          <div class="direct-ad-title">Watch sponsor to unlock this episode</div>
          <div class="direct-ad-sub">Please click on the button below to view the sponsor's page and unlock your content.</div>
          <a class="direct-ad-btn" href="${escapeHtml(validLink)}" target="_blank" rel="noopener noreferrer">Tap Here</a>
        </div>

    function startAdCountdown(index, actualEpisodeId) {
      const skipBox = document.getElementById(`adSkipBox_${index}`);
      const btnText = document.getElementById(`adBtnText_${index}`);

      skipBox.classList.remove('hidden');
      skipBox.classList.add('disabled');
      
      let count = 3;
       btnText.innerText = `${count}`;

      activeAdCountdown = setInterval(() => {
        count--;
        if (count > 0) {
          btnText.innerText = `${count}`;
        } else {
          clearInterval(activeAdCountdown);
          btnText.innerText = `Skip ➔`;
          skipBox.classList.remove('disabled');
          document.getElementById('shortsContainer').classList.remove('locked');
        }
      }, 1000);
    }

    function handleSkipClick(index, episodeId) {
      const skipBox = document.getElementById(`adSkipBox_${index}`);
      if (skipBox.classList.contains('disabled')) return;

      skipBox.classList.add('hidden');
      const lmBtn = document.getElementById(`adLearnMore_${index}`);
      if (lmBtn) lmBtn.classList.remove('active');

      unlockedEpisodes.add(index);
      document.getElementById('shortsContainer').classList.remove('locked');
      loadPlayerContent(index, episodeId, false);
      saveHistory(currentShowName, index);
    }

    function closeShortsPlayer() {
      if (activeAdCountdown) clearInterval(activeAdCountdown);
      document.getElementById('shortsModal').classList.remove('active');
      Object.keys(ytPlayers).forEach(i => { if (ytPlayers[i] && ytPlayers[i].destroy) { try { ytPlayers[i].destroy(); } catch(e) {} } });
      Object.keys(progressTimers).forEach(i => clearInterval(progressTimers[i]));
      ytPlayers = {};
      progressTimers = {};
      document.getElementById('shortsContainer').innerHTML = "";
      currentObservedIndex = -1;
      window.scrollTo(0, savedScrollPosition);
    }

    window.onpopstate = function () {
      if (document.getElementById('shortsModal').classList.contains('active')) {
        closeShortsPlayer();
      } else if (document.getElementById('historyPageView').classList.contains('active')) {
        closeHistoryWindow();
      }
    };

function handleAppShareOrInstall() {
  const shareTitle = 'HR STUDIO - Official App';
  const shareText = '🎬 Watch Your Favorite Shows And Trending Episodes On:\n\n*HR STUDIO APP!* 🍿🔥\n\n💯% Free & No Subscription Required!\n\nTap to watch now:';
  const shareUrl = 'https://harshcodecraftstudio.github.io/hr-studio/';

  // Agar browser Web Share API support karta hai (Mobile devices)
  if (navigator.share) {
    // Agar aap image bhi sath me share karna chahte hain aur browser support karta hai
    fetch('icon.png')
      .then(response => response.blob())
      .then(blob => {
        const file = new File([blob], 'icon.png', { type: blob.type });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({
            title: shareTitle,
            text: shareText,
            url: shareUrl,
            files: [file]
          }).catch(() => {});
        } else {
          // Fallback agar file sharing support nahi hai
          navigator.share({ title: shareTitle, text: `${shareText}\n${shareUrl}` }).catch(() => {});
        }
      }).catch(() => {
        navigator.share({ title: shareTitle, text: `${shareText}\n${shareUrl}` }).catch(() => {});
      });
  } else {
    // Desktop ya PC ke liye clipboard copy fallback
    navigator.clipboard.writeText(`${shareText}\n${shareUrl}`).then(() => {
      showToast('Link copied to clipboard 📋');
    }).catch(() => {
      showToast('Failed to copy link');
    });
  }
}

🍿 ${showName} — Episode ${epIndex + 1}

💯 100% FREE

▶️ Tap to Watch Now:
${shareUrl}

        fetch(imageUrl, { mode: 'cors' })
          .then(response => {

          })
          .then(blob => {
            const fileExtension = imageUrl.split('.').pop().split('?')[0].split('#')[0] || 'jpg';
            const file = new File([blob], `episode_thumbnail.${fileExtension}`, { type: blob.type || 'image/jpeg' });
            
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              navigator.share({
                title: `${showName} - Episode ${epIndex + 1}`,
                text: shareText,
                files: [file]
              }).catch(() => {
                // Fallback agar file share cancel ya error de
                fallbackShareOnly(shareName, epIndex, shareText);
              });
            } else {
              fallbackShareOnly(showName, epIndex, shareText);
            }
          }).catch(() => {
            // CORS ya fetch fail hone par bina image ke direct text/link share kar dega (kabhi Ruke ga nahi)
            fallbackShareOnly(showName, epIndex, shareText);
          });
      } else {
        navigator.clipboard.writeText(shareText).then(() => {
          showToast('Episode link copied to clipboard!');
        }).catch(() => {
          showToast('Failed to copy Episode!');
        });
      }
    }

    function fallbackShareOnly(showName, epIndex, shareText) {
      if (navigator.share) {
        navigator.share({
          title: `${showName} - Episode ${epIndex + 1}`,
          text: shareText
        }).catch(() => {});
      }
                      }

    // --- NOTIFICATION SYSTEM WITH APP BADGING (INSTAGRAM STYLE) ---

let globalNotifications = [];

// CSV Line Parser helper
function parseCSVLine(text) {
  let result = [];
  let current = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    let char = text[i];
    if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === ',' && !inQuotes) {
      result.push(current.trim());
      current = '';
    } else {
      current += char;
    }
  }
  result.push(current.trim());
  return result;
}

// HTML Escape helper
function escapeHtml(str) {
  return String(str ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

// Google Sheet se data fetch karna
async function fetchNotificationsFromSheet() {
  try {
    const response = await fetch(MASSAGE_URL + '&t=' + new Date().getTime());
    if (!response.ok) return;
    const data = await response.text();
    
    const rows = data.split(/\r?\n/).map(r => r.trim());
    let parsedMatrix = rows.map(r => parseCSVLine(r));

    // Header (Row 1) ko hata dena
    parsedMatrix.shift(); 

    let validRows = [];
    for (let i = 0; i < parsedMatrix.length; i++) {
      let row = parsedMatrix[i];
      if (!row || row.length === 0) break;

      let rowHasData = row.some(cell => cell && cell.replace(/^"|"$/g, '').trim() !== "");
      if (!rowHasData) {
        break; 
      }
      validRows.push(row);
    }
    
    let reversedRows = validRows.reverse();
    let notifs = [];
    
    reversedRows.forEach((row, index) => {
      let columnsData = [];
      let firstVal = ""; 

      let lastValidIndex = -1;
      for (let c = 0; c < row.length; c++) {
        let val = row[c] ? row[c].replace(/^"|"$/g, '').trim() : "";
        if (val !== "") {
          lastValidIndex = c;
        }
      }

      if (lastValidIndex === -1) return;

      let activeColumns = [];
      for (let c = 0; c <= lastValidIndex; c++) {
        let val = row[c] ? row[c].replace(/^"|"$/g, '').trim() : "";
        if (val !== "") {
          let cleanVal = escapeHtml(val);
          activeColumns.push(cleanVal);
          if (columnsData.length === 0) {
            firstVal = cleanVal; 
          }
        }
      }

      let totalColumnCount = activeColumns.length;

      if (activeColumns.length > 0) {
        let combinedText = activeColumns.join("<br>");
        let colAValue = row[0] ? row[0].replace(/^"|"$/g, '').trim() : "";
let displayTitle = (colAValue !== "") ? escapeHtml(colAValue) : "Notification";

        notifs.push({
          id: `msg_${index}_${Date.now()}`,
          msgCount: totalColumnCount,
          displayTitle: displayTitle,
          text: combinedText
        });
      }
    });
    
    globalNotifications = notifs; 
    checkUnreadNotifications();
  } catch (e) {
    console.log("Notification fetch error:", e);
  }
}

// Unread count check karke App Icon aur In-App Badge dono update karna
function checkUnreadNotifications() {
  if (globalNotifications.length === 0) return;

  let readIds = JSON.parse(localStorage.getItem('hr_read_notifications') || '[]');
  let unreadCount = globalNotifications.filter(n => !readIds.includes(n.id)).length;

  // 1. App ke andar header/bell icon ka badge update karna
  const badge = document.getElementById('notifBadge');
  if (badge) {
    if (unreadCount > 0) {
      badge.innerText = unreadCount > 99 ? '99+' : unreadCount;
      badge.classList.add('active');
    } else {
      badge.classList.remove('active');
    }
  }

  // 2. Phone ke Home Screen App Icon par Instagram style badge dikhane ke liye (PWA required)
  if ('setAppBadge' in navigator) {
    if (unreadCount > 0) {
      navigator.setAppBadge(unreadCount).catch(err => console.log('App badge error:', err));
    } else {
      navigator.clearAppBadge().catch(err => console.log('Clear badge error:', err));
    }
  }
}

// Notification List Window Open karna
function openNotificationWindow() {
  renderNotificationList();
  document.getElementById('notifPageView').classList.add('active');
  history.pushState({ page: 'notifList' }, "");
}

function renderNotificationList() {
  const body = document.getElementById('notifContentBody');
  if (globalNotifications.length === 0) {
    body.innerHTML = `<div class="history-empty-msg" style="text-align:center; padding:20px; color:#aaa;">No notifications available right now.</div>`;
    return;
  }

  let readIds = JSON.parse(localStorage.getItem('hr_read_notifications') || '[]');
  let html = '';

  globalNotifications.forEach(n => {
    let isUnread = !readIds.includes(n.id);
    
    html += `
      <div class="msg-card-item ${isUnread ? 'unread' : ''}" onclick="openSingleNotification('${n.id}')" style="background: linear-gradient(145deg, #181818, #222222); border: 1px solid ${isUnread ? '#ff3366' : '#333'}; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.4); position: relative; transition: all 0.3s ease;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-weight: 700; color: #ffffff; font-size: 16px; letter-spacing: 0.5px;">${n.displayTitle}</span>
          <span style="background: ${isUnread ? '#ff3366' : '#333'}; color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; box-shadow: 0 2px 8px rgba(255,51,102,0.4);">${n.msgCount}</span>
        </div>
      </div>
    `;
  });
    body.innerHTML = html;
}

// Specific Message Click karne par message kholna aur read mark karna
function openSingleNotification(notifId) {
  let notif = globalNotifications.find(n => n.id === notifId);
  if (!notif) return;

  let readIds = JSON.parse(localStorage.getItem('hr_read_notifications') || '[]');
  if (!readIds.includes(notifId)) {
    readIds.push(notifId);
    localStorage.setItem('hr_read_notifications', JSON.stringify(readIds));
    checkUnreadNotifications(); // Jaise hi message read hoga, badge count kam ho jayega
  }

  let urlRegex = /(https?:\r\n[^\s]+|https?:\/\/[^\s]+)/g;
  let formattedText = notif.text.replace(urlRegex, (url) => {
    return `<a class="msg-card-link" href="${url}" target="_blank" rel="noopener noreferrer" style="color: #ff3366; text-decoration: underline;">${url}</a>`;
  });

  const detailBody = document.getElementById('notifDetailContentBody');
  detailBody.innerHTML = `
    <div style="padding: 16px; display: flex; flex-direction: column; align-items: flex-start;">
      <div style="background: linear-gradient(135deg, #1f1f1f, #2a2a2a); border-left: 4px solid #ff3366; border-radius: 12px; padding: 20px; width: 100%; box-shadow: 0 8px 24px rgba(0,0,0,0.5); position: relative;">
        <div style="font-size: 12px; font-weight: bold; color: #ff3366; margin-bottom: 12px; letter-spacing: 1px; text-transform: uppercase;">
          HR Studio Official Message
        </div>
        <div style="font-size: 17px; line-height: 2.2; word-break: break-word; color: #f2f2f2;">
          ${formattedText}
        </div>
      </div>
    </div>
  `;

  document.getElementById('notifDetailView').classList.add('active');
  history.pushState({ page: 'notifDetail' }, "");
}

  }
};    
    
    


    // Ad skip button timer //

function triggerSkipTimerAfterClick(index, actualEpisodeId) {
  const lmBtn = document.getElementById(`adLearnMore_${index}`);
  const directBtn = document.querySelector(`#playerBox_${index} .direct-ad-btn`);
  
  let isTimerStarted = false;

  const startTimer = () => {
    if (isTimerStarted) return; // Agar timer pehle hi chal pada hai toh dobara na chale
    isTimerStarted = true;

    const skipBox = document.getElementById(`adSkipBox_${index}`);
    if (!skipBox) return;

    // Skip box ko ab screen par dikha do (jo pehle hidden tha)
    skipBox.classList.remove('hidden');
    skipBox.classList.add('disabled');
    
    const btnText = document.getElementById(`adBtnText_${index}`);
    
    let timeLeft = 3; // Yahan se timer shuru hoga (3 seconds)
    
    // Har 1 second me timer ko update karne ke liye interval chalayein
    const countdownInterval = setInterval(() => {
      if (timeLeft > 0) {
        if (btnText) btnText.innerText = `Skip in ${timeLeft}s`;
        timeLeft--;
      } else {
        clearInterval(countdownInterval);
        // Timer khatam hone par arrow ke sath Skip Ad dikhayein
        if (btnText) btnText.innerText = "Skip Ad ➡︎";
        skipBox.classList.remove('disabled');
        document.getElementById('shortsContainer').classList.remove('locked');
        
        // Skip button par click karne ka action
        skipBox.onclick = () => handleSkipClick(index, actualEpisodeId);
      }
    }, 1000);
  };

  if (lmBtn) {
    lmBtn.addEventListener('click', startTimer);
  }
  if (directBtn) {
    directBtn.addEventListener('click', startTimer);
  }
    }

    // Episode Jump //
    
function openEpisodesDrawer() {
  const drawer = document.getElementById('episodesDrawer');
  const listContainer = document.getElementById('episodesDrawerList');
  listContainer.innerHTML = "";

  if (!currentShowEpisodes || currentShowEpisodes.length === 0) return;

  currentShowEpisodes.forEach((ep, index) => {
    const btn = document.createElement('div');
    btn.style.cssText = "background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); padding:12px; text-align:center; border-radius:10px; cursor:pointer; font-weight:bold; font-size:14px; color:#fff;";
    btn.innerText = `Ep ${index + 1}`;
    
    btn.onclick = () => {
      closeEpisodesDrawer();
      jumpToEpisode(index);
    };
    listContainer.appendChild(btn);
  });

  drawer.style.display = 'block';
  history.pushState({ drawerOpen: true }, ""); // Yahan history state add ki
}

function closeEpisodesDrawer() {
  document.getElementById('episodesDrawer').style.display = 'none';
}

    function jumpToEpisode(index) {
  const container = document.getElementById('shortsContainer');
  const targetItem = container.querySelector(`[data-index="${index}"]`);
  
  if (targetItem) {
    // 1. Pehle smooth scroll karein taaki user ko wahan tak ka transition dikhe
    targetItem.scrollIntoView({ behavior: 'smooth' });
    
    // 2. Thode delay ke baad us episode ke index ko active set karke playEpisode function call karein
    setTimeout(() => {
      currentObservedIndex = index;
      playEpisode(index);
    }, 200);
  }
    }
