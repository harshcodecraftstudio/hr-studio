<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HR STUDIO APP - Offline</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;background:#0a0a0f;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#fff}
  body{overflow-y:auto;overflow-x:hidden}

  /* Header */
  .app-header{display:flex;flex-direction:column;align-items:center;padding:26px 16px 20px;background:linear-gradient(180deg,#15151b,#0a0a0f);border-bottom:1px solid rgba(255,255,255,.08)}
  .app-logo-row{display:flex;align-items:center;gap:10px}
  .app-logo{width:38px;height:38px;border-radius:10px;object-fit:cover;box-shadow:0 4px 14px rgba(255,0,85,.35)}
  .app-name{font-size:19px;font-weight:900;letter-spacing:.3px}
  .app-name span{color:#ff0055}
  .offline-label{margin-top:10px;display:flex;align-items:center;gap:6px;background:#1c1c22;border:1px solid rgba(255,255,255,.1);padding:6px 14px;border-radius:99px;font-size:11px;font-weight:700;color:rgba(255,255,255,.7)}
  .offline-dot{width:6px;height:6px;border-radius:50%;background:#ff4b4b;box-shadow:0 0 6px rgba(255,75,75,.8)}

  /* Games grid */
  .section-title{padding:20px 16px 10px;font-size:15px;font-weight:800}
  .games-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:0 16px 30px}
  .game-card{background:#141419;border:1px solid rgba(255,255,255,.07);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .15s}
  .game-card:active{transform:scale(.97)}
  .game-thumb{height:130px;display:flex;align-items:center;justify-content:center;font-size:48px;background:linear-gradient(135deg,#1c1c22,#111116)}
  .game-thumb img{width:100%;height:100%;object-fit:cover}
  .game-info{padding:10px 12px 14px}
  .game-title{font-size:13px;font-weight:800}
  .game-sub{font-size:10px;color:rgba(255,255,255,.45);margin-top:3px;font-weight:600}
  .empty-state{padding:40px 20px;text-align:center;color:rgba(255,255,255,.4);font-size:13px}

  /* Fullscreen game overlay */
  .game-overlay{position:fixed;inset:0;background:#0a0a0f;z-index:3000;display:none;flex-direction:column}
  .game-overlay.active{display:flex}
  .game-overlay-header{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#111116;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
  .game-back-btn{background:#1c1c22;color:#fff;border:1px solid rgba(255,255,255,.14);padding:8px 14px;border-radius:99px;font-size:12px;font-weight:700;cursor:pointer}
  .game-overlay-title{font-size:14px;font-weight:800}
  #gameStage{flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column}

  /* ===== Shared styles used by games (kept generic so any game can reuse) ===== */
  .g-scores{display:flex;justify-content:center;gap:28px;padding:14px 0 4px}
  .g-score-box{text-align:center}
  .g-score-label{font-size:10px;color:rgba(255,255,255,.45);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
  .g-score-value{font-size:26px;font-weight:900;color:#fff;margin-top:2px}
  .g-score-value.accent{color:#ff0055}
  .g-area{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;position:relative}
  .g-canvas{background:#111116;border:1px solid rgba(255,255,255,.1);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);touch-action:none}
  .g-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:rgba(10,10,15,.88);backdrop-filter:blur(6px);z-index:10;padding:20px;text-align:center}
  .g-overlay.hidden{display:none}
  .g-overlay h1{font-size:26px;font-weight:900}
  .g-overlay h1 span{color:#ff0055}
  .g-overlay p{font-size:13px;color:rgba(255,255,255,.6);max-width:260px;line-height:1.5}
  .g-play-btn{background:#ff0055;color:#fff;border:0;padding:13px 32px;border-radius:99px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(255,0,85,.35)}
  .g-play-btn:active{transform:scale(.96)}
  .g-new-high{color:#ffd23f;font-weight:800;font-size:13px}
  .g-icon{font-size:44px}
  .g-controls{padding:10px 20px 22px;display:flex;justify-content:center;flex-shrink:0}
  .g-dpad{display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px 56px;gap:6px}
  .g-dpad button{background:#1c1c22;border:1px solid rgba(255,255,255,.12);border-radius:14px;color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .g-dpad button:active{background:#ff0055}
  .g-dpad .up{grid-column:2;grid-row:1}
  .g-dpad .left{grid-column:1;grid-row:2}
  .g-dpad .mid{grid-column:2;grid-row:2;background:transparent;border:0}
  .g-dpad .right{grid-column:3;grid-row:2}
  .g-dpad .down{grid-column:2;grid-row:3}
  .g-hint{text-align:center;font-size:10px;color:rgba(255,255,255,.35);padding-bottom:6px;flex-shrink:0}
</style>
</head>
<body>

  <div class="app-header">

<script>
"use strict";

/* =====================================================
   CANVAS
===================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;
let dpr = 1;

function resize(){

    dpr = Math.min(window.devicePixelRatio || 1, 2);

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);

    canvas.style.width = W + "px";
    canvas.style.height = H + "px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resize);
resize();

/* =====================================================
   GAME STATE
===================================================== */

let running = false;
let paused = false;

let score = 0;
let level = 1;
let lives = 3;

let lastTime = 0;
let enemyTimer = 0;
let shootTimer = 0;

let shake = 0;

let bestScore =
    Number(localStorage.getItem("hr_neon_best") || 0);

/* =====================================================
   PLAYER
===================================================== */

const player = {
    x:0,
    y:0,
    w:34,
    h:42,
    speed:6,
    invincible:0
};

function resetPlayer(){

    player.x = W / 2;
    player.y = H - 105;
    player.invincible = 0;
}

resetPlayer();

/* =====================================================
   OBJECT ARRAYS
===================================================== */

let bullets = [];
let enemies = [];
let particles = [];
let explosions = [];
let powerups = [];
let stars = [];

/* =====================================================
   INPUT
===================================================== */

let moveLeft = false;
let moveRight = false;

/* Keyboard */

const keys = {};

window.addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()] = true;

    if(
        e.key === "ArrowLeft" ||
        e.key === "ArrowRight" ||
        e.key === " "
    ){
        e.preventDefault();
    }

    if(e.key.toLowerCase() === "p"){
        togglePause();
    }
});

window.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false;
});

/* Touch controls */

function bindHold(button,callback){

    const start = e =>{
        e.preventDefault();
        callback(true);
        button.classList.add("active");
    };

    const end = e =>{
        e.preventDefault();
        callback(false);
        button.classList.remove("active");
    };

    button.addEventListener("pointerdown",start);
    button.addEventListener("pointerup",end);
    button.addEventListener("pointercancel",end);
    button.addEventListener("pointerleave",end);
}

bindHold(
    document.getElementById("leftBtn"),
    value => moveLeft = value
);

bindHold(
    document.getElementById("rightBtn"),
    value => moveRight = value
);

/* =====================================================
   BACK TO APP
===================================================== */

function goBackToApp(){
    if (window.parent) {
        window.parent.postMessage('HR_CLOSE_GAME', '*');
    }
}
/* =====================================================
   STAR FIELD
===================================================== */

function createStars(){

    stars = [];

    const count = Math.max(
        80,
        Math.floor(W * H / 9000)
    );

    for(let i=0;i<count;i++){

        stars.push({
            x:Math.random()*W,
            y:Math.random()*H,
            z:Math.random()*3+1,
            size:Math.random()*1.8+.3
        });
    }
}

createStars();

function updateStars(dt){

    for(const s of stars){

        s.y += s.z * 0.45 * dt;

        if(s.y > H){

            s.y = -5;
            s.x = Math.random()*W;
        }
    }
}

function drawStars(){

    for(const s of stars){

        ctx.globalAlpha =
            Math.min(.8,s.z/3);

        ctx.fillStyle = "#9eefff";

        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

/* =====================================================
   PARTICLES
===================================================== */

function particleBurst(
    x,
    y,
    amount=15,
    power=3
){

    for(let i=0;i<amount;i++){

        const a = Math.random()*Math.PI*2;
        const s = Math.random()*power+1;

        particles.push({

            x,
            y,

            vx:Math.cos(a)*s,
            vy:Math.sin(a)*s,

            life:1,
            size:Math.random()*3+1
        });
    }
}

function updateParticles(dt){

    for(let i=particles.length-1;i>=0;i--){

        const p = particles[i];

        p.x += p.vx*dt;
        p.y += p.vy*dt;

        p.vx *= .985;
        p.vy *= .985;

        p.life -= .025*dt;

        if(p.life<=0){
            particles.splice(i,1);
        }
    }
}

function drawParticles(){

    for(const p of particles){

        ctx.globalAlpha =
            Math.max(0,p.life);

        ctx.fillStyle="#00eaff";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size*p.life,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;
}

  /* =====================================================
   EXPLOSIONS
===================================================== */

function explode(x,y,big=false){

    explosions.push({
        x,
        y,
        r:4,
        max:big?55:35,
        life:1
    });

    particleBurst(
        x,
        y,
        big?35:20,
        big?5:3
    );

    playExplosion(big);
}

function updateExplosions(dt){

    for(let i=explosions.length-1;i>=0;i--){

        const e = explosions[i];

        e.r += (e.max-e.r)*.15*dt;
        e.life -= .035*dt;

        if(e.life<=0){
            explosions.splice(i,1);
        }
    }
}

function drawExplosions(){

    for(const e of explosions){

        ctx.globalAlpha =
            Math.max(0,e.life);

        ctx.strokeStyle="#00eaff";
        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.arc(
            e.x,
            e.y,
            e.r,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }

    ctx.globalAlpha=1;
}

/* =====================================================
   BULLETS
===================================================== */

function shoot(){

    bullets.push({

        x:player.x,
        y:player.y-23,

        vx:0,
        vy:-11,

        w:3,
        h:15,

        life:1
    });

    playShoot();
}

function updateBullets(dt){

    for(let i=bullets.length-1;i>=0;i--){

        const b=bullets[i];

        b.x += b.vx*dt;
        b.y += b.vy*dt;

        if(b.y < -30){

            bullets.splice(i,1);
        }
    }
}

function drawBullets(){

    for(const b of bullets){

        const grad =
            ctx.createLinearGradient(
                b.x,
                b.y,
                b.x,
                b.y+b.h
            );

        grad.addColorStop(0,"#ffffff");
        grad.addColorStop(.4,"#00eaff");
        grad.addColorStop(1,"rgba(0,234,255,0)");

        ctx.fillStyle=grad;

        ctx.shadowBlur=12;
        ctx.shadowColor="#00eaff";

        ctx.fillRect(
            b.x-b.w/2,
            b.y,
            b.w,
            b.h
        );

        ctx.shadowBlur=0;
    }
}

/* =====================================================
   ENEMIES
===================================================== */

function spawnEnemy(){

    const types = [
        "basic",
        "fast",
        "tank"
    ];

    let type =
        types[Math.floor(Math.random()*types.length)];

    let size = 30;
    let hp = 1;
    let speed = 1.5;

    if(type==="fast"){

        size=24;
        hp=1;
        speed=2.6 + level*.05;
    }

    if(type==="tank"){

        size=44;
        hp=3;
        speed=1.0 + level*.03;
    }

    enemies.push({

        x:size + Math.random()*(W-size*2),
        y:-size,

        size,
        hp,

        maxHp:hp,

        speed:
            speed +
            Math.random()*.8 +
            level*.08,

        angle:Math.random()*Math.PI*2,

        type
    });
}

function updateEnemies(dt){

    for(let i=enemies.length-1;i>=0;i--){

        const e=enemies[i];

        e.y += e.speed*dt;

        e.angle += .025*dt;

        if(e.y > H+70){

            enemies.splice(i,1);

            lives--;

            updateHUD();

            explode(player.x,H-50,true);

            if(lives<=0){
                gameOver();
            }

            continue;
        }

        /* Player collision */

        if(
            player.invincible<=0 &&
            distance(
                player.x,
                player.y,
                e.x,
                e.y
            ) < e.size*.65 + 18
        ){

            enemies.splice(i,1);

            lives--;

            player.invincible=100;

            explode(e.x,e.y,true);

            updateHUD();

            if(lives<=0){
                gameOver();
            }
        }
    }
}

/* =====================================================
   DRAW ENEMIES
===================================================== */

function drawEnemies(){

    for(const e of enemies){

        ctx.save();

        ctx.translate(e.x,e.y);

        ctx.rotate(Math.sin(e.angle)*.12);

        ctx.shadowBlur=18;
        ctx.shadowColor=
            e.type==="tank"
            ? "#ff3366"
            : "#ff00ff";

        ctx.strokeStyle=
            e.type==="tank"
            ? "#ff4466"
            : "#ff00ff";

        ctx.fillStyle="rgba(255,0,180,.12)";

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.moveTo(0,-e.size*.6);

        ctx.lineTo(e.size*.65,e.size*.35);

        ctx.lineTo(e.size*.28,e.size*.58);

        ctx.lineTo(0,e.size*.35);

        ctx.lineTo(-e.size*.28,e.size*.58);

        ctx.lineTo(-e.size*.65,e.size*.35);

        ctx.closePath();

        ctx.fill();
        ctx.stroke();

        /* Core */

        ctx.fillStyle="#ff55dd";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            e.size*.18,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();

        /* HP bar */

        if(e.maxHp>1){

            const width=e.size*1.4;

            ctx.fillStyle="rgba(255,255,255,.12)";

            ctx.fillRect(
                e.x-width/2,
                e.y-e.size*.85,
                width,
                4
            );

            ctx.fillStyle="#ff3366";

            ctx.fillRect(
                e.x-width/2,
                e.y-e.size*.85,
                width*(e.hp/e.maxHp),
                4
            );
        }
    }
}

/* =====================================================
   POWERUPS
===================================================== */

function spawnPowerup(x,y){

    if(Math.random()>.16){
        return;
    }

    powerups.push({

        x,
        y,

        vy:1.4,

        type:
            Math.random()>.5
            ? "life"
            : "score",

        life:600
    });
}

function updatePowerups(dt){

    for(let i=powerups.length-1;i>=0;i--){

        const p=powerups[i];

        p.y += p.vy*dt;
        p.life -= dt;

        if(
            p.life<=0 ||
            p.y>H+30
        ){
            powerups.splice(i,1);
            continue;
        }

        if(
            distance(
                p.x,
                p.y,
                player.x,
                player.y
            ) < 30
        ){

            if(p.type==="life"){
                lives=Math.min(5,lives+1);
            }else{
                score+=100;
            }

            updateHUD();

            particleBurst(
                p.x,
                p.y,
                20,
                3
            );

            powerups.splice(i,1);
        }
    }
}

function drawPowerups(){

    for(const p of powerups){

        ctx.save();

        ctx.translate(p.x,p.y);

        ctx.rotate(Date.now()*.002);

        ctx.strokeStyle =
            p.type==="life"
            ? "#66ff88"
            : "#ffe600";

        ctx.shadowBlur=18;
        ctx.shadowColor=ctx.strokeStyle;

        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.rect(-12,-12,24,24);

        ctx.stroke();

        ctx.fillStyle=ctx.strokeStyle;

        ctx.font="bold 14px Arial";
        ctx.textAlign="center";
        ctx.textBaseline="middle";

        ctx.fillText(
            p.type==="life" ? "+" : "$",
            0,
            0
        );

        ctx.restore();
    }
  }

  /* =====================================================
   PLAYER DRAW
===================================================== */

function drawPlayer(){

    if(player.invincible>0){

        if(
            Math.floor(player.invincible/6)%2===0
        ){
            return;
        }
    }

    ctx.save();

    ctx.translate(player.x,player.y);

    /* Glow */

    ctx.shadowBlur=25;
    ctx.shadowColor="#00eaff";

    /* Ship body */

    const grad =
        ctx.createLinearGradient(
            0,-25,
            0,25
        );

    grad.addColorStop(0,"#ffffff");
    grad.addColorStop(.35,"#00eaff");
    grad.addColorStop(1,"#0066ff");

    ctx.fillStyle=grad;

    ctx.strokeStyle="#8fffff";
    ctx.lineWidth=1.5;

    ctx.beginPath();

    ctx.moveTo(0,-27);

    ctx.lineTo(17,17);

    ctx.lineTo(7,14);

    ctx.lineTo(0,25);

    ctx.lineTo(-7,14);

    ctx.lineTo(-17,17);

    ctx.closePath();

    ctx.fill();
    ctx.stroke();

    /* Wings */

    ctx.fillStyle="#063c70";

    ctx.beginPath();

    ctx.moveTo(-15,9);
    ctx.lineTo(-29,20);
    ctx.lineTo(-10,17);

    ctx.closePath();

    ctx.fill();

    ctx.beginPath();

    ctx.moveTo(15,9);
    ctx.lineTo(29,20);
    ctx.lineTo(10,17);

    ctx.closePath();

    ctx.fill();

    /* Cockpit */

    ctx.fillStyle="#fff";

    ctx.beginPath();

    ctx.ellipse(
        0,
        -8,
        5,
        8,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* Engine */

    ctx.shadowBlur=15;
    ctx.shadowColor="#00eaff";

    ctx.fillStyle="#00eaff";

    ctx.beginPath();

    ctx.moveTo(-6,19);
    ctx.lineTo(0,34+Math.random()*6);
    ctx.lineTo(6,19);

    ctx.closePath();

    ctx.fill();

    ctx.restore();
}

/* =====================================================
   COLLISIONS
===================================================== */

function distance(x1,y1,x2,y2){

    const dx=x1-x2;
    const dy=y1-y2;

    return Math.sqrt(dx*dx+dy*dy);
}

function checkBulletCollisions(){

    for(let bi=bullets.length-1;bi>=0;bi--){

        const b=bullets[bi];

        let hit=false;

        for(let ei=enemies.length-1;ei>=0;ei--){

            const e=enemies[ei];

            if(
                Math.abs(b.x-e.x) <
                e.size*.65
                &&
                Math.abs(b.y-e.y) <
                e.size*.65
            ){

                e.hp--;

                bullets.splice(bi,1);

                particleBurst(
                    b.x,
                    b.y,
                    7,
                    2
                );

                hit=true;

                if(e.hp<=0){

                    score +=
                        e.type==="tank"
                        ? 40
                        : e.type==="fast"
                        ? 20
                        : 10;

                    spawnPowerup(e.x,e.y);

                    explode(
                        e.x,
                        e.y,
                        e.type==="tank"
                    );

                    enemies.splice(ei,1);

                    updateHUD();
                }

                break;
            }
        }

        if(hit) continue;
    }
}

/* =====================================================
   AUTO FIRE
===================================================== */

function automaticFire(dt){

    /*
       Continuous automatic shooting.
       Fire rate becomes slightly faster with level.
    */

    shootTimer += dt;

    const fireDelay =
        Math.max(
            8,
            15 - level*.25
        );

    if(shootTimer >= fireDelay){

        shootTimer=0;

        shoot();
    }
}

/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function updatePlayer(dt){

    let direction=0;

    if(
        keys["arrowleft"] ||
        keys["a"] ||
        moveLeft
    ){
        direction--;
    }

    if(
        keys["arrowright"] ||
        keys["d"] ||
        moveRight
    ){
        direction++;
    }

    player.x +=
        direction *
        player.speed *
        dt;

    player.x =
        Math.max(
            25,
            Math.min(
                W-25,
                player.x
            )
        );

    if(player.invincible>0){
        player.invincible-=dt;
    }
}

/* =====================================================
   LEVEL
===================================================== */

function updateLevel(){

    const newLevel =
        Math.floor(score/250)+1;

    if(newLevel !== level){

        level=newLevel;

        particleBurst(
            player.x,
            player.y,
            35,
            5
        );

        updateHUD();
    }
}

/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    document.getElementById("score")
        .textContent=score;

    document.getElementById("level")
        .textContent=level;

    document.getElementById("lives")
        .textContent=lives;
}

/* =====================================================
   BACKGROUND
===================================================== */

function drawBackground(){

    const grad =
        ctx.createRadialGradient(
            W/2,
            H*.65,
            20,
            W/2,
            H*.5,
            Math.max(W,H)
        );

    grad.addColorStop(0,"#07152d");
    grad.addColorStop(.5,"#030817");
    grad.addColorStop(1,"#01020a");

    ctx.fillStyle=grad;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    /* Grid */

    ctx.globalAlpha=.09;

    ctx.strokeStyle="#00eaff";
    ctx.lineWidth=1;

    const grid=45;

    for(
        let x=0;
        x<W;
        x+=grid
    ){

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();
    }

    for(
        let y=0;
        y<H;
        y+=grid
    ){

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();
    }

    ctx.globalAlpha=1;
}

/* =====================================================
   SHAKE
===================================================== */

function applyShake(){

    if(shake<=0){
        return;
    }

    const amount=shake*.4;

    ctx.translate(
        (Math.random()-.5)*amount,
        (Math.random()-.5)*amount
    );

    shake*=.92;
}

 /* =====================================================
   AUDIO
===================================================== */

let audioCtx=null;

function initAudio(){

    if(!audioCtx){

        try{

            audioCtx =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }catch(e){}
    }

    if(
        audioCtx &&
        audioCtx.state==="suspended"
    ){
        audioCtx.resume();
    }
}

function beep(
    frequency,
    duration,
    type="sine",
    volume=.025
){

    if(!audioCtx){
        return;
    }

    try{

        const osc =
            audioCtx.createOscillator();

        const gain =
            audioCtx.createGain();

        osc.type=type;
        osc.frequency.value=frequency;

        gain.gain.setValueAtTime(
            volume,
            audioCtx.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audioCtx.currentTime+duration
        );

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();

        osc.stop(
            audioCtx.currentTime+duration
        );

    }catch(e){}
}

function playShoot(){
    beep(720,.045,"square",.018);
}

function playExplosion(big){

    beep(
        big?80:120,
        big?.22:.12,
        "sawtooth",
        big?.045:.028
    );
}

/* =====================================================
   MAIN UPDATE
===================================================== */

function update(dt){

    if(!running || paused){
        return;
    }

    updateStars(dt);

    updatePlayer(dt);

    automaticFire(dt);

    updateBullets(dt);

    enemyTimer += dt;

    const spawnDelay =
        Math.max(
            18,
            55 - level*2.5
        );

    if(enemyTimer >= spawnDelay){

        enemyTimer=0;

        spawnEnemy();

        if(
            level>=4 &&
            Math.random()<.25
        ){
            spawnEnemy();
        }
    }

    updateEnemies(dt);

    updatePowerups(dt);

    updateParticles(dt);

    updateExplosions(dt);

    checkBulletCollisions();

    updateLevel();
}

/* =====================================================
   DRAW
===================================================== */

function draw(){

    ctx.save();

    drawBackground();

    applyShake();

    drawStars();

    drawPowerups();

    drawBullets();

    drawEnemies();

    drawParticles();

    drawExplosions();

    drawPlayer();

    ctx.restore();
}

/* =====================================================
   GAME LOOP
===================================================== */

function loop(time){

    const dt =
        Math.min(
            2,
            (time-lastTime)/16.67 || 1
        );

    lastTime=time;

    update(dt);

    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* =====================================================
   START GAME
===================================================== */

function startGame(){

    initAudio();

    score=0;
    level=1;
    lives=3;

    bullets=[];
    enemies=[];
    particles=[];
    explosions=[];
    powerups=[];

    resetPlayer();

    enemyTimer=0;
    shootTimer=0;

    running=true;
    paused=false;

    updateHUD();

    document
        .getElementById("startScreen")
        .classList.add("hidden");

    document
        .getElementById("gameOverScreen")
        .classList.add("hidden");

    document
        .getElementById("pauseScreen")
        .classList.add("hidden");

    document.getElementById("pauseBtn")
        .textContent="Ⅱ";
}

/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

    running=false;
    paused=false;

    if(score>bestScore){

        bestScore=score;

        localStorage.setItem(
            "hr_neon_best",
            bestScore
        );
    }

    document.getElementById("finalScore")
        .textContent=score;

    document.getElementById("bestScore")
        .textContent=bestScore;

    document
        .getElementById("gameOverScreen")
        .classList.remove("hidden");

    document.getElementById("pauseBtn")
        .textContent="Ⅱ";
}

/* =====================================================
   PAUSE
===================================================== */

function togglePause(){

    if(!running){
        return;
    }

    paused=!paused;

    document
        .getElementById("pauseScreen")
        .classList.toggle(
            "hidden",
            !paused
        );

    document.getElementById("pauseBtn")
        .textContent =
            paused ? "▶" : "Ⅱ";
}

/* =====================================================
   BUTTONS
===================================================== */

document
    .getElementById("startBtn")
    .addEventListener(
        "click",
        startGame
    );

document
    .getElementById("restartBtn")
    .addEventListener(
        "click",
        startGame
    );

document
    .getElementById("resumeBtn")
    .addEventListener(
        "click",
        togglePause
    );

document
    .getElementById("pauseBtn")
    .addEventListener(
        "click",
        ()=>{
            initAudio();
            togglePause();
        }
    );

/* =====================================================
   TAP CANVAS TO START AUDIO
===================================================== */

canvas.addEventListener(
    "pointerdown",
    ()=>{
        initAudio();
    }
);

/* =====================================================
   PREVENT MOBILE GESTURES
===================================================== */

document.addEventListener(
    "gesturestart",
    e=>e.preventDefault()
);

document.addEventListener(
    "contextmenu",
    e=>e.preventDefault()
);

/* =====================================================
   INITIAL HUD
===================================================== */

updateHUD();

/* Initial background */

draw();

<\/script>

</body>
</html>`;

 {m:[[1,1,1,1]], c:0},

 {m:[[1,0,0],[1,1,1]], c:3},

    };

    const up=e=>{

    };

    btn.addEventListener(
        "pointerdown",

    );

    btn.addEventListener(

    );

    btn.addEventListener(

    );

    btn.addEventListener(
        "pointerleave",

function changeLane(dir){

        0,

/* ======================================
   AUDIO
====================================== */

let audio=null;

function initAudio(){

    if(!audio){

        try{

            audio=new(
                window.AudioContext||
                window.webkitAudioContext
            )();

        }catch(e){}
    }

    if(
        audio &&
        audio.state==="suspended"
    ){
        audio.resume();
    }
}

function playSound(
    frequency,
    duration,
    type="sine",
    volume=.02
){

    if(!audio)return;

    try{

        const osc=
            audio.createOscillator();

        const gain=
            audio.createGain();

        osc.type=type;

        osc.frequency.value=
            frequency;

        gain.gain.setValueAtTime(
            volume,
            audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            .001,
            audio.currentTime+
            duration
        );

        osc.connect(gain);
        gain.connect(
            audio.destination
        );

        osc.start();

        osc.stop(
            audio.currentTime+
            duration
        );

    }catch(e){}
}

/* ======================================
   ROAD DRAW
====================================== */

function drawRoad(){

    /* sky */

    const sky=
        ctx.createLinearGradient(
            0,0,
            0,H
        );

    sky.addColorStop(
        0,
        "#050814"
    );

    sky.addColorStop(
        .5,
        "#091526"
    );

    sky.addColorStop(
        1,
        "#020308"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,0,W,H
    );


    /* side ground */

    ctx.fillStyle="#080c12";

    ctx.fillRect(
        0,0,W,H
    );


    /* neon side glow */

    ctx.fillStyle=
        "rgba(0,180,255,.05)";

    ctx.fillRect(
        0,0,
        road.center-road.width/2,
        H
    );

    ctx.fillRect(
        road.center+road.width/2,
        0,
        W,
        H
    );


    /* road */

    const leftEdge=
        road.center-road.width/2;

    const rightEdge=
        road.center+road.width/2;

    const gradient=
        ctx.createLinearGradient(
            leftEdge,0,
            rightEdge,0
        );

    gradient.addColorStop(
        0,
        "#11151c"
    );

    gradient.addColorStop(
        .5,
        "#1a1d24"
    );

    gradient.addColorStop(
        1,
        "#11151c"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        leftEdge,
        0,
        road.width,
        H
    );


    /* road edges */

    ctx.shadowBlur=12;
    ctx.shadowColor="#00eaff";

    ctx.strokeStyle="#00eaff";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
        leftEdge,
        0
    );

    ctx.lineTo(
        leftEdge,
        H
    );

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        rightEdge,
        0
    );

    ctx.lineTo(
        rightEdge,
        H
    );

    ctx.stroke();

    ctx.shadowBlur=0;


    /* lane lines */

    ctx.strokeStyle=
        "rgba(255,255,255,.55)";

    ctx.lineWidth=2;

    const dashH=42;
    const gap=35;

    for(let lane=1;lane<3;lane++){

        const x=
            leftEdge+
            road.laneWidth*lane;

        for(
            let y=
                -dashH+
                (roadOffset%(dashH+gap));
            y<H;
            y+=dashH+gap
        ){

            ctx.beginPath();

            ctx.moveTo(
                x,
                y
            );

            ctx.lineTo(
                x,
                y+dashH
            );

            ctx.stroke();
        }
    }
}


/* ======================================
   TRAFFIC SPAWN
====================================== */

function spawnTraffic(){

    const lane=
        Math.floor(
            Math.random()*3
        );

    const types=[
        "car",
        "truck",
        "bike"
    ];

    const type=
        types[
            Math.floor(
                Math.random()*types.length
            )
        ];

    let w=44;
    let h=78;

    if(type==="truck"){

        w=50;
        h=98;

    }

    if(type==="bike"){

        w=29;
        h=62;

    }

    traffic.push({

        lane,
        x:laneX(lane),

        y:-120,

        w,
        h,

        type,

        speed:
            2+
            Math.random()*2+
            distanceTravelled*.00004
    });
}


/* ======================================
   TRAFFIC UPDATE
====================================== */

function updateTraffic(dt){

    for(
        let i=traffic.length-1;
        i>=0;
        i--
    ){

        const car=traffic[i];

        car.y+=
            (car.speed+
            speed*.38)*
            dt;

        car.x=laneX(car.lane);

        if(
            car.y>
            H+130
        ){

            traffic.splice(i,1);

            score+=10;

            continue;
        }

        if(
            collision(
                player.x,
                player.y,
                player.w,
                player.h,
                car.x,
                car.y,
                car.w,
                car.h
            )
        ){

            crash();

            traffic.splice(i,1);

            return;
        }
    }
}


/* ======================================
   DRAW TRAFFIC
====================================== */

function drawTraffic(){

    for(const car of traffic){

        drawCar(
            car.x,
            car.y,
            car.w,
            car.h,
            car.type,
            false
        );
    }
}


/* ======================================
   DRAW CAR
====================================== */

function drawCar(
    x,
    y,
    w,
    h,
    type,
    playerCar
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    if(playerCar){

        ctx.rotate(
            player.tilt*.08
        );
    }

    /* shadow */

    ctx.fillStyle=
        "rgba(0,0,0,.5)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        h*.43,
        w*.65,
        9,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* wheels */

    ctx.fillStyle="#050609";

    ctx.fillRect(
        -w*.55,
        -h*.27,
        w*.18,
        h*.3
    );

    ctx.fillRect(
        w*.37,
        -h*.27,
        w*.18,
        h*.3
    );

    ctx.fillRect(
        -w*.55,
        h*.02,
        w*.18,
        h*.3
    );

    ctx.fillRect(
        w*.37,
        h*.02,
        w*.18,
        h*.3
    );


    /* body */

    let bodyColor=
        playerCar
        ? "#00aaff"
        : type==="truck"
        ? "#ff6b21"
        : type==="bike"
        ? "#b000ff"
        : "#d82040";

    const body=
        ctx.createLinearGradient(
            -w/2,
            0,
            w/2,
            0
        );

    body.addColorStop(
        0,
        "#06101b"
    );

    body.addColorStop(
        .28,
        bodyColor
    );

    body.addColorStop(
        .5,
        "#ffffff"
    );

    body.addColorStop(
        .62,
        bodyColor
    );

    body.addColorStop(
        1,
        "#06101b"
    );

    ctx.fillStyle=body;

    ctx.shadowBlur=
        playerCar ? 20 : 9;

    ctx.shadowColor=
        bodyColor;

    ctx.beginPath();

    const r=8;

    ctx.roundRect(
        -w/2,
        -h/2,
        w,
        h,
        r
    );

    ctx.fill();

    ctx.shadowBlur=0;


    /* windshield */

    ctx.fillStyle=
        playerCar
        ? "#072b43"
        : "#151b26";

    ctx.beginPath();

    ctx.roundRect(
        -w*.31,
        -h*.30,
        w*.62,
        h*.28,
        5
    );

    ctx.fill();


    /* center stripe */

    if(playerCar){

        ctx.fillStyle=
            "rgba(255,255,255,.85)";

        ctx.fillRect(
            -2,
            -h*.47,
            4,
            h*.88
        );
    }


    /* lights */

    ctx.fillStyle=
        playerCar
        ? "#eaffff"
        : "#ff3045";

    ctx.shadowBlur=10;

    ctx.shadowColor=
        playerCar
        ? "#00eaff"
        : "#ff1744";

    ctx.fillRect(
        -w*.30,
        -h*.46,
        w*.17,
        5
    );

    ctx.fillRect(
        w*.13,
        -h*.46,
        w*.17,
        5
    );

    ctx.shadowBlur=0;


    /* player nitro */

    if(
        playerCar &&
        player.nitro &&
        nitro>0
    ){

        ctx.fillStyle="#00eaff";

        ctx.shadowBlur=20;
        ctx.shadowColor="#00eaff";

        ctx.beginPath();

        ctx.moveTo(
            -8,
            h/2
        );

        ctx.lineTo(
            0,
            h/2+28+
            Math.random()*12
        );

        ctx.lineTo(
            8,
            h/2
        );

        ctx.closePath();

        ctx.fill();

        ctx.shadowBlur=0;
    }

    ctx.restore();
}


/* ======================================
   COINS
====================================== */

function spawnCoin(){

    const lane=
        Math.floor(
            Math.random()*3
        );

    coinsList.push({

        x:laneX(lane),

        y:-30,

        r:11,

        rot:0,

        speed:2
    });
}

function updateCoins(dt){

    for(
        let i=coinsList.length-1;
        i>=0;
        i--
    ){

        const c=coinsList[i];

        c.y+=
            (c.speed+
            speed*.42)*
            dt;

        c.rot+=.08*dt;

        if(
            c.y>H+40
        ){

            coinsList.splice(i,1);

            continue;
        }

        if(
            distance(
                player.x,
                player.y,
                c.x,
                c.y
            )<30
        ){

            coins++;

            score+=50;

            burst(
                c.x,
                c.y,
                18,
                3
            );

            playSound(
                850,
                .09,
                "sine",
                .035
            );

        }
    }
}

function drawCoins(){

    for(const c of coinsList){

        ctx.save();

        ctx.translate(
            c.x,
            c.y
        );

        ctx.rotate(
            c.rot
        );

        ctx.shadowBlur=16;
        ctx.shadowColor="#ffe600";

        ctx.strokeStyle="#ffe600";

        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.ellipse(
            0,0,
            c.r*.65,
            c.r,
            0,
            0,

        );

        ctx.stroke();

        ctx.fillStyle="#ffe600";

        ctx.font=

        );

/* ======================================
   PARTICLES
====================================== */

function burst(
    x,
    y,
    count,
    power
){

    for(
        let i=0;
        i<count;
        i++
    ){

        const a=
            Math.random()*
            Math.PI*2;

        const s=
            Math.random()*
            power+1;

        particles.push({

            x,
            y,

            vx:Math.cos(a)*s,
            vy:Math.sin(a)*s,

            life:1,

            size:
                Math.random()*3+1
        });
    }
}

function updateParticles(dt){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p=particles[i];

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;

        p.vx*=.97;
        p.vy*=.97;

        p.life-=.035*dt;

        if(p.life<=0){

            particles.splice(i,1);
        }
    }
}

function drawParticles(){

    for(const p of particles){

        ctx.globalAlpha=
            Math.max(0,p.life);

        ctx.fillStyle="#00eaff";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;
}


/* ======================================
   COLLISION
====================================== */

function collision(
    x1,y1,w1,h1,
    x2,y2,w2,h2
){

    return (
        Math.abs(x1-x2)
        <
        (w1+w2)*.43
        &&
        Math.abs(y1-y2)
        <
        (h1+h2)*.43
    );
}

function distance(
    x1,y1,
    x2,y2
){

    const dx=x1-x2;
    const dy=y1-y2;

    return Math.sqrt(
        dx*dx+
        dy*dy
    );
}


/* ======================================
   CRASH
====================================== */

function crash(){

    if(crashTimer>0)return;

    crashTimer=80;

    running=false;

    shake=25;

    burst(
        player.x,
        player.y,
        55,
        7
    );

    playSound(
        70,
        .5,
        "sawtooth",
        .07
    );

    if(score>best){

        best=score;

        localStorage.setItem(
            "neonRushBest",
            best
        );
    }

    document.getElementById(
        "finalScore"
    ).textContent=score;

    document.getElementById(
        "finalDistance"
    ).textContent=
        Math.floor(
            distanceTravelled
        )+" m";

    document.getElementById(
        "bestScore"
    ).textContent=best;

    setTimeout(
        ()=>{
            document.getElementById(
                "gameOverScreen"
            ).classList.remove(
                "hidden"
            );
        },
        450
    );
}


/* ======================================
   NITRO
====================================== */

function updateNitro(dt){

    if(
        player.nitro &&
        nitro>0
    ){

        nitro-=
            .65*dt;

        speed=
            Math.min(
                16,
                speed+.08*dt
            );

        score+=
            Math.floor(
                2*dt
            );

        if(
            Math.random()<.35
        ){

            particles.push({

                x:player.x+
                    (Math.random()-.5)*15,

                y:player.y+40,

                vx:
                    (Math.random()-.5)*1,

                vy:
                    3+Math.random()*4,

                life:1,

                size:
                    Math.random()*3+2
            });
        }

    }else{

        nitro+=.12*dt;

        nitro=Math.min(
            100,
            nitro
        );

        speed+=
            (7+distanceTravelled*.0003-
            speed)*.01*dt;
    }

    document.getElementById(
        "nitroBar"
    ).style.width=
        nitro+"%";
}


/* ======================================
   PLAYER UPDATE
====================================== */

function updatePlayer(dt){

    const oldX=
        player.x;

    player.x+=
        (player.targetX-
        player.x)*.22*dt;

    player.tilt=
        player.x-oldX;

    player.y=
        H-135;
}

/* ======================================
   GAME PROGRESSION
====================================== */

function updateGame(dt){

    distanceTravelled+=
        speed*.55*dt;

    roadOffset+=
        speed*dt;

    spawnTimer+=dt;
    coinTimer+=dt;

    /* traffic */

    const spawnDelay=
        Math.max(
            20,
            58-
            distanceTravelled*.003
        );

    if(
        spawnTimer>
        spawnDelay
    ){

        spawnTimer=0;

        spawnTraffic();
    }

    /* coins */

    if(
        coinTimer>42
    ){

        coinTimer=0;

        spawnCoin();
    }

    /* speed */

    const targetSpeed=
        Math.min(
            12,
            7+
            distanceTravelled*.001
        );

    if(!player.nitro){

        speed+=
            (targetSpeed-speed)
            *.008*dt;
    }

    score+=
        Math.floor(
            speed*.08*dt
        );
}


/* ======================================
   HUD
====================================== */

function updateHUD(){

    document.getElementById(
        "score"
    ).textContent=
        Math.floor(score);

    document.getElementById(
        "distance"
    ).textContent=
        Math.floor(
            distanceTravelled
        )+" m";

    document.getElementById(
        "speed"
    ).textContent=
        Math.floor(
            speed*18
        )+" km/h";

    document.getElementById(
        "coins"
    ).textContent=coins;
}


/* ======================================
   PAUSE
====================================== */

function togglePause(){

    if(!running)return;

    paused=!paused;

    document.getElementById(
        "pauseScreen"
    ).classList.toggle(
        "hidden",
        !paused
    );

    document.getElementById(
        "pauseBtn"
    ).textContent=
        paused ? "▶" : "Ⅱ";
}


/* ======================================
   BACK
====================================== */

function backToApp(){

    if(
        document.referrer &&
        document.referrer.includes(
            "index.html"
        )
    ){

        history.back();

    }else{

        location.href=
            "index.html";
    }
}


/* ======================================
   START
====================================== */

function startGame(){

    initAudio();

    resize();
    updateRoad();

    running=true;
    paused=false;

    score=0;
    coins=0;
    distanceTravelled=0;

    speed=7;
    nitro=100;

    spawnTimer=0;
    coinTimer=0;

    crashTimer=0;

    traffic=[];
    coinsList=[];
    particles=[];

    resetPlayer();

    document.getElementById(
        "startScreen"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "pauseScreen"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "gameOverScreen"
    ).classList.add(
        "hidden"
    );

    updateHUD();
}


/* ======================================
   DRAW
====================================== */

function draw(){

    ctx.save();

    if(shake>0){

        ctx.translate(
            (Math.random()-.5)*shake,
            (Math.random()-.5)*shake
        );

        shake*=.88;
    }

    drawRoad();

    drawCoins();

    drawTraffic();

    drawParticles();

    drawCar(
        player.x,
        player.y,
        player.w,
        player.h,
        "car",
        true
    );

    ctx.restore();
}


/* ======================================
   LOOP
====================================== */

let lastTime=
    performance.now();

function loop(now){

    const dt=
        Math.min(
            2,
            (now-lastTime)/16.67
        );

    lastTime=now;

    if(
        running &&
        !paused
    ){

        updatePlayer(dt);

        updateGame(dt);

        updateNitro(dt);

        updateTraffic(dt);

        updateCoins(dt);

        updateParticles(dt);

        updateHUD();
    }

    draw();

    requestAnimationFrame(
        loop
    );
}


/* ======================================
   INIT
====================================== */

resize();
updateRoad();
resetPlayer();

requestAnimationFrame(
    loop
);


/* BUTTONS */

      score = 0;
      speed = 140;
      running = true;
      placeFood();
      scoreVal.textContent = '0';
      if (loopId) clearTimeout(loopId);
      tick();
    }

    function placeFood(){
      let valid = false;
      while(!valid){
        food = { x: Math.floor(Math.random()*cols), y: Math.floor(Math.random()*rows) };
        valid = !snake.some(s => s.x === food.x && s.y === food.y);
      }
    }

    function tick(){
      if (!running || destroyed) return;
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
      if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows || snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver();
        return;
      }
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreVal.textContent = score;
        placeFood();
        if (speed > 70) speed -= 3;
      } else {
        snake.pop();
      }
      draw();
      loopId = setTimeout(tick, speed);
    }

    function draw(){
      if (!ctx) return;
      ctx.fillStyle = '#111116';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.strokeStyle = 'rgba(255,255,255,0.03)';
      for(let i=1;i<cols;i++){
        ctx.beginPath(); ctx.moveTo(i*cellSize,0); ctx.lineTo(i*cellSize,canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0,i*cellSize); ctx.lineTo(canvas.width,i*cellSize); ctx.stroke();
      }
      ctx.fillStyle = '#ffd23f';
      const fpad = cellSize*0.18;
      roundRect(ctx, food.x*cellSize+fpad, food.y*cellSize+fpad, cellSize-fpad*2, cellSize-fpad*2, 5);
      ctx.fill();
      snake.forEach((s, i) => {
        ctx.fillStyle = i === 0 ? '#ff0055' : '#ff4b86';
        const pad = cellSize*0.08;
        roundRect(ctx, s.x*cellSize+pad, s.y*cellSize+pad, cellSize-pad*2, cellSize-pad*2, 6);
        ctx.fill();
      });
    }

    function roundRect(ctx,x,y,w,h,r){
      ctx.beginPath();
      ctx.moveTo(x+r,y);
      ctx.arcTo(x+w,y,x+w,y+h,r);
      ctx.arcTo(x+w,y+h,x,y+h,r);
      ctx.arcTo(x,y+h,x,y,r);
      ctx.arcTo(x,y,x+w,y,r);
      ctx.closePath();
    }

    function gameOver(){
      running = false;
      if (loopId) clearTimeout(loopId);
      best = loadBest();
      let isNew = false;
      if (score > best) { best = score; saveBest(best); isNew = true; }
      bestVal.textContent = best;
      finalScoreText.textContent = 'Score: ' + score;
      newHighText.style.display = isNew ? 'block' : 'none';
      overOverlay.classList.remove('hidden');
    }

    function setDir(x,y){
      if (dir.x === -x && dir.y === -y) return;
      nextDir = {x,y};
    }

    stage.querySelector('#s-btnUp').onclick = () => setDir(0,-1);
    stage.querySelector('#s-btnDown').onclick = () => setDir(0,1);
    stage.querySelector('#s-btnLeft').onclick = () => setDir(-1,0);
    stage.querySelector('#s-btnRight').onclick = () => setDir(1,0);

    function keyHandler(e){
      if (e.key === 'ArrowUp') setDir(0,-1);
      else if (e.key === 'ArrowDown') setDir(0,1);
      else if (e.key === 'ArrowLeft') setDir(-1,0);
      else if (e.key === 'ArrowRight') setDir(1,0);
    }
    window.addEventListener('keydown', keyHandler);

    let touchStartX = 0, touchStartY = 0;
    function touchStartHandler(e){
      const t = e.touches[0];
      touchStartX = t.clientX; touchStartY = t.clientY;
    }
    function touchEndHandler(e){
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
      if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
      else setDir(0, dy > 0 ? 1 : -1);
    }
    canvas.addEventListener('touchstart', touchStartHandler, {passive:true});
    canvas.addEventListener('touchend', touchEndHandler, {passive:true});

    stage.querySelector('#s-startBtn').onclick = () => {
      startOverlay.classList.add('hidden');
      resetGame();
    };
    stage.querySelector('#s-retryBtn').onclick = () => {
      overOverlay.classList.add('hidden');
      resetGame();
    };

    function resizeHandler(){ resizeCanvas(); }
    window.addEventListener('resize', resizeHandler);

    best = loadBest();
    bestVal.textContent = best;
    resizeCanvas();

    // Return a cleanup function so the hub can stop this game when closed
    return function destroy(){
      destroyed = true;
      running = false;
      if (loopId) clearTimeout(loopId);
      window.removeEventListener('keydown', keyHandler);
      window.removeEventListener('resize', resizeHandler);
    };
  }

  for(const w of wins)if(b[w[0]]&&b[w[0]]===b[w[1]]&&b[w[1]]===b[w[2]])return {winner:b[w[0]],line:w};
  if(b.every(Boolean))return {winner:"draw",line:[]};
  return null;
}
function playerMove(i){
  if(!gameActive||paused||turn!=="X"||cells[i])return;

  const r=result();if(r)return finish(r);
  turn="O";statusEl.textContent="AI is thinking…";
  setTimeout(aiMove,mode==="hard"?380:260);

function aiMove(){

  else if(mode==="medium")move=Math.random()<.65?bestMove():randomMove();

  const a=cells.map((v,i)=>v?null:i).filter(v=>v!==null);return a[Math.floor(Math.random()*a.length)];
}

  let best=-Infinity,move=randomMove();
  for(let i=0;i<9;i++)if(!cells[i]){
    cells[i]="O";let s=minimax(cells,false);cells[i]="";

  if(isMax){let best=-Infinity;for(let i=0;i<9;i++)if(!b[i]){b[i]="O";best=Math.max(best,minimax(b,false));b[i]="";}return best}
